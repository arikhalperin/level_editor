acceptance:
  - id: A1
    source: brief.md
    text: A1 — With no server listening on the configured endpoint, Generate fails
      within the connection timeout with a message naming the endpoint and the
      cause; the entities, level size, background and unsaved-changes state of
      the open level are all unchanged.
    result: passed
    reason:
      text: Connect failure names the exact endpoint and a non-empty cause inside the
        timeout; on any Err the dialog applies nothing, so the open level is
        untouched.
      truncated: false
  - id: A2
    source: brief.md
    text: "A2 — The model client sends `POST {endpoint}/chat/completions` with the
      configured model name and, when a key is available, an `Authorization:
      Bearer` header carrying it; the endpoint and model settings survive a save
      and reload of the editor config."
    result: passed
    reason:
      text: The socket test asserts the real request line, Host, model, messages,
        stream, seed and response_format; request_head asserts the exact bearer
        line; and the endpoint, model and seed come back into a fresh
        EditorState from a real config file.
      truncated: false
  - id: A3
    source: brief.md
    text: "A3 — A reply wrapped in prose or a ```json fence still parses: the first
      balanced JSON object is extracted and used."
    result: passed
    reason:
      text: parse_reply tries each candidate start; prose, both fence forms, a brace
        in prose, braces and escaped quotes in strings, top-level arrays and
        no-JSON are all covered.
      truncated: false
  - id: A4
    source: brief.md
    text: 'A4 — A reply naming an entity outside the toolbox vocabulary (for example
      `bitmap_name: "spike_wall"`) is rejected, that chamber is re-asked, and no
      unknown name ever reaches the canvas.'
    result: passed
    reason:
      text: "Invented names are rejected wherever written — under bitmap_name, under
        another name key, and with vertices present — and the chamber is
        re-asked. The load-bearing half holds by construction rather than by
        test: the only strings that can become a delivered name are a type that
        is already in the vocabulary, a value read_known has proved is in it, a
        read_named value re-checked against it, or the literal polygon_tool, and
        parse_entities is the only path from model JSON to an entity, with
        repair adding only wall_tool ledges."
      truncated: false
  - id: A5
    source: brief.md
    text: A5 — Structural validation rejects, and re-asks for, a polygon with fewer
      than three vertices, a non-finite or out-of-bounds coordinate, a
      non-positive bitmap size, and a `rope_tool` entry whose length is below
      60.
    result: passed
    reason:
      text: Fewer than three vertices, non-finite including quoted, out of bounds,
        non-positive size, rope thickness and rope length are all still hard
        errors, and the null-or-empty vertices narrowing was traced not to
        bypass any of them.
      truncated: false
  - id: A6
    source: brief.md
    text: "A6 — Generation runs on a worker thread: while a generation is in flight
      the editor keeps repainting and the progress panel reports the current
      stage; Cancel ends it and leaves the open level untouched."
    result: passed
    reason:
      text: The worker is a real thread, the dialog repaints every frame while it
        runs, a cancelled otherwise-succeeding transcript yields Cancelled with
        no level, and a dead worker is reported as Worker rather than Cancelled.
      truncated: false
  - id: A7
    source: brief.md
    text: A7 — The traversal prover, given a hand-built level with a 200 px gap
      between two ledges at equal height, proves the route and returns an input
      sequence that the simulation replays to the exit.
    result: passed
    reason:
      text: The 200 px gap is proven and the returned route replays to within the
        arrival radius.
      truncated: false
  - id: A8
    source: brief.md
    text: A8 — The prover, given the same level with the gap widened to 1400 px and
      no wall to climb and no rope, reports the route unprovable and names the
      ledge the route dies on.
    result: passed
    reason:
      text: The 1400 px gap is unprovable with the frontier pinned to the end of the
        left ledge, the nearest unreached foothold on the far ledge, and explain
        carrying the ledge, the distance and the dash figure.
      truncated: false
  - id: A9
    source: brief.md
    text: "A9 — The prover proves a route that requires each advanced move in turn:
      a dash-only gap (between `JUMP_HEIGHT`-reach and `DASH_DISTANCE` 450), a
      wall-jump-only shaft, and a climb-only face of `wall_tool`."
    result: passed
    reason:
      text: Dash proven with the full repertoire and unprovable with every dash
        primitive removed; the wall-jump shaft proven and unprovable with its
        faces deleted; the climb case delivered as the brief's own recorded
        substitution.
      truncated: false
  - id: A10
    source: brief.md
    text: A10 — A model reply whose chamber fails the proof is re-asked at most
      twice, and the feedback sent back names the failing ledge and the distance
      to the nearest foothold.
    result: passed
    reason:
      text: Exactly two retries then repair, only the chamber the route died in
        re-asked, and the retry prompt carrying the rejection, the dying ledge,
        the nearest-foothold distance and the dash figure.
      truncated: false
  - id: A11
    source: brief.md
    text: A11 — When retries are exhausted, deterministic repair edits the geometry
      until the simulation proves the route, and the delivered level's route is
      proven by the same prover that rejected the original.
    result: passed
    reason:
      text: repair re-proves and replays after every edit and returns only on a route
        that replays; the delivered level is confirmed by the same prover that
        rejected the original, and nothing the model wrote is moved.
      truncated: false
  - id: A12
    source: brief.md
    text: A12 — When repair cannot succeed within its budget, generation fails with
      that reason and the open level is untouched; no partially repaired level
      is ever delivered.
    result: passed
    reason:
      text: Out of budget yields Unprovable naming the attempt count and the last
        failure; generate propagates it so nothing is applied and no partially
        repaired level exists.
      truncated: false
  - id: A13
    source: brief.md
    text: "A13 — Accepting a generated level replaces the current one in a single
      undoable step: one Ctrl+Z restores the previous entities, level size and
      spawn exactly."
    result: passed
    reason:
      text: One undo-stack push, and one undo restores entities, level size, spawn,
        exit and the replaced level's file path.
      truncated: false
  - id: A14
    source: brief.md
    text: A14 — With unsaved changes, Generate opens the existing Save / Discard /
      Cancel confirmation; Cancel leaves the level and the generation request
      untouched.
    result: passed
    reason:
      text: Unsaved changes set the pending action without opening the window; a clean
        level opens it at once; the prompt names the action.
      truncated: false
  - id: A15
    source: brief.md
    text: A15 — The `Generate` menu item is disabled while play mode is running,
      with the same hover explanation `New Level` uses.
    result: passed
    reason:
      text: The item is gated on play.is_none() with hover text byte-identical to New
        Level and Load Level. The one item resting on reading rather than a
        check, as egui menus are not exercised headlessly here.
      truncated: false
  - id: A16
    source: brief.md
    text: A16 — `LevelData` round-trips `spawn` and `exit`; a level file written
      before this change (no `spawn`, no `exit` keys) loads with both `None` and
      no error, and an explicit `null` for either loads as `None`.
    result: passed
    reason:
      text: Round trip, a file with neither key, explicit nulls and Default; both
        fields serde-defaulted exactly as level_size.
      truncated: false
  - id: A17
    source: brief.md
    text: A17 — Pressing Play on a level whose `spawn` is (1200, 700) starts the
      character at (1200, 700) rather than the centre of the visible canvas; on
      a level with no `spawn` the view-centre behaviour is unchanged; a click
      during play still moves the spawn; and `New Level` clears it.
    result: passed
    reason:
      text: start_play prefers the level's spawn; all four clauses tested, and load
        and save carry both fields.
      truncated: false
  - id: A18
    source: brief.md
    text: A18 — An end-to-end generation driven by a recorded model transcript (no
      live server) produces a level whose every entity is in the toolbox
      vocabulary, whose `spawn` and `exit` are set, whose `level_size` matches
      the extent used, and whose route the prover confirms.
    result: passed
    reason:
      text: The transcript run asserts seven in-vocabulary entities, spawn, exit and
        level_size, the model's own work, a non-empty route, the staged
        requests, the re-proof and replay of the delivered level, and that
        repair never ran.
      truncated: false
  - id: A19
    source: brief.md
    text: "A19 — The defaults are OpenAI's: a fresh config yields endpoint
      `https://api.openai.com/v1` and model `gpt-6-astra`, and `Generate` is
      available without the user typing a model name. An endpoint pointed at
      `http://localhost:11434/v1` is still accepted and still drives a local
      server over plain HTTP."
    result: passed
    reason:
      text: Defaults are OpenAI's and are asserted as a struct and through a fresh
        config; the prefilled model means nothing must be typed; a remembered
        localhost endpoint survives, needs no key, and its plain-HTTP path is
        driven against a real socket.
      truncated: false
  - id: A20
    source: brief.md
    text: A20 — An `https://` endpoint is accepted rather than refused, and a
      request to one is made over TLS. Offline this is asserted against a local
      TLS listener; the live case is A23.
    result: passed
    reason:
      text: A real rustls handshake against a local listener dialled by the name its
        certificate is for, with a proper negative control where the same
        listener serves the same good response and only trust differs, failing
        on the certificate. No verification bypass exists in shipping code.
      truncated: false
  - id: A21
    source: brief.md
    text: "A21 — The API key is read from `OPENAI_API_KEY` and never persisted:
      after a generation, the editor's config file contains no value matching
      the key, and neither the key nor any `Authorization` header value appears
      in any log line the editor emits."
    result: passed
    reason:
      text: The key is read only from the environment and rendered only into the
        request head; the written config is asserted to hold no key field and no
        match for the live key; and a TRACE subscriber over a failing request
        made with a key in hand finds neither the key nor 'bearer' in the logs
        or the user-facing error.
      truncated: false
  - id: A22
    source: brief.md
    text: A22 — With no `OPENAI_API_KEY` set and an endpoint that requires one,
      `Generate` fails before any request is sent, with a message naming the
      variable; the open level is untouched. With a localhost endpoint and no
      key, no key is required and no `Authorization` header is sent.
    result: passed
    reason:
      text: MissingKey is returned before any socket is opened, naming the variable
        and offering the localhost alternative; the dialog also refuses to
        start; and every loopback spelling is sent no header.
      truncated: false
  - id: A23
    source: brief.md
    text: "A23 — A live smoke test against OpenAI, run with the user's own key: one
      generation produces a level whose route the prover confirms. This is the
      only acceptance item that leaves the machine and the only one that cannot
      be run offline; it must be recorded as actually run or as not run, never
      assumed."
    result: passed
    reason:
      text: "Run live five times, passing each time; most recently 183.8s on the
        shipped default gpt-6-astra after this fix, with 36 entities, a 5-move
        route and nothing repaired or skipped. An earlier run on the same model
        exercised the retry path for real: the proof rejected the first attempt,
        the failure went back naming the exact ledge, only the offending chamber
        was re-asked, and the second attempt passed. Provenance stated plainly:
        the Verifier audited the harness in full and found it sound — it refuses
        to run without a key with an explicit note that it must never be
        reported as passed unrun, refuses an endpoint that needs no key so a
        loopback stub cannot fake a pass, defaults to the shipped endpoint and
        model, asserts a non-empty level and a non-zero route before anything
        could mask them, and re-proves and replays the delivered route — but did
        not re-run it, being forbidden to spend the user's money."
      truncated: false
  - id: A24
    source: brief.md
    text: A24 — The outline request asks for a connection point between each pair of
      adjoining chambers, and each chamber request states the entry and exit
      points that chamber must put floor at. A recorded transcript whose
      chambers meet at their stated connection points produces a level the
      prover confirms **without any repair**, and the neighbouring floors at
      each connection point are within a jumpable step of one another.
    result: passed
    reason:
      text: The outline request asks for connections with the shape shown, explains
        why, and states the reachability rule; parse_outline enforces it,
        rejecting no connections, self-joins, duplicate doorways and any chamber
        unreachable from the first by breadth-first search. Each chamber is told
        its own doorways, the neighbour beyond each and the continuous-floor
        requirement, all from the single doorways definition. The well-connected
        transcript generates with neither Repairing nor Retrying entered and the
        floors either side of the doorway within a jumpable step.
      truncated: false
builder_handoff:
  candidate_id: 6fad0548-5bd2-4510-b100-e98ab93f55c4
  identity_provider: skill-coordinated
  builder_execution_ref: skill-coordinated:builder:0f5c8bf0-9056-47ba-8458-3243b11ca9f3
  iteration: 9
  summary:
    text: >-
      Iteration 12: the read_named defect, which the user asked to have fixed
      before archiving. The three documentation inaccuracies are left as
      recorded known limitations, by the user's decision.


      THE DEFECT. read_named took the first key that was present rather than the
      first whose value meant anything, so an entity giving both a human label
      and the real answer — {"name": "spiked pit", "sprite": "death_trap_tool"}
      — was read for the label and the answer was never consulted. That mattered
      twice over: without vertices the entity was rejected as carrying an
      invented name, condemning a chamber that had named itself perfectly well;
      with vertices it looked like something that claimed to be no sprite at
      all, so the vertices decided the kind and a death trap became a solid
      platform. The second is the one that matters, because the route proof can
      never catch it: added floor only ever makes a route easier, so a hazard
      turned into geometry would have shipped in silence.


      THE FIX. A new read_known takes the first key whose value is actually in
      the vocabulary, and read_named is kept for saying what was found when
      nothing does — so an invented name is still reported and A4 is untouched.
      The sprite lookup now tries read_known first and falls back to read_named
      only for the error message; claims_a_sprite uses read_known, so a label
      can no longer hide a real name from the kind decision. The polygon-type
      lookup already preferred a real type by hand and now says so with the same
      helper, which also fixes the matching downgrade there: a polygon carrying
      "kind": "decoration" alongside "tool": "wall_tool" keeps its climbability
      instead of falling back to polygon_tool.


      Four tests: three spellings of a label beside a real name, the labelled
      hazard carrying vertices that must stay a hazard, and the polygon that
      must keep its type. The last of those fails loudly with a message naming
      what went wrong, since a silent conversion is the failure mode.


      LIVE: a fifth consecutive passing run on the shipped default after the fix
      — 183.8s, five chambers, 36 entities, a 5-move route, every entity the
      model's own work.
    truncated: false
  addressed_acceptance_ids:
