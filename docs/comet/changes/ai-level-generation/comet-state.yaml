      entity construction site and confirming parse_entities is the only path
      from model JSON to an entity. A23 is recorded as passed on five live runs
      with the harness independently audited and found unfakeable by the code
      under test. The remaining risks are low severity, and the two that are
      behaviour deltas from this fix both fail in the safe direction."
    truncated: false
  risks:
    - text: 'Inherent to the fix and accepted: in a self-contradicting reply an
        out-of-vocabulary word is ignored rather than rejected whenever another
        key holds a real one, so {"bitmap_name": "spike_wall", "sprite":
        "coin_tool"} becomes a coin. This is the unavoidable dual of preferring
        the vocabulary value, which is what fixes the hazard-into-platform bug.
        The blast radius is small: the chosen value is always a word the model
        literally wrote, the two vocabularies are disjoint, and every polygon
        type is solid, so the delivered level is the one the prover proved.'
      truncated: false
    - text: "Residual and pre-existing, unchanged by this fix: an entity that declares
        itself a bitmap, carries vertices and names no vocabulary word anywhere
        still becomes a plain polygon, so an intended hazard could become floor
        where nothing in the code could know what was meant. Closing it would
        mean rejecting a declared bitmap that has a position or size instead of
        re-kinding it."
      truncated: false
    - text: The error message on a rejected name blames the first name key present
        rather than the invented word, so an entity with a label under an
        earlier key is rejected citing the label. Mitigated by bitmap_name being
        first in the key list and by the message listing the four legal sprites,
        so the retry is still actionable.
      truncated: false
    - text: "A new but safe delta: scanning all the name keys means an entity with
        vertices and a real sprite name under a later key is now read as a
        sprite with its vertices discarded, where it previously became a
        polygon. Removing floor makes the proof harder, so the prover catches
        it."
      truncated: false
    - text: The spec says a chamber that fails structural validation is re-asked, but
        an entity that names no sprite at all is dropped with a note and the
        rest of the chamber delivered. Every A5 case and every invented name
        remains a hard error, so neither item fails, but the prose does not
        describe that path.
      truncated: false
    - text: "A latent prover and play-mode divergence on rope length:
        from_level_entity clamps to ROPE_MIN_LENGTH while world_of does not, and
        they agree only because the constants are equal and validation rejects
        shorter ropes."
      truncated: false
    - text: A15, and the open-level-untouched halves of A1 and A12, rest on code
        inspection rather than an automated check, as no egui menu test is
        possible here.
      truncated: false
    - text: "The no-logging test's comment overstates its offline claim: a DNS query
        for the reserved host does reach the resolver, though no service is
        contacted and the test is robust to every resolver outcome."
      truncated: false
    - text: "Accepted by the user and deliberately unfixed: the spec's repair prose
        overstating what the repairer does, the brief's arithmetically wrong A9
        parenthetical, and the spec describing JSON-schema-constrained output
        where the code sends JSON mode."
      truncated: false
    - text: "Still accepted rather than fixed: an empty chamber entity list is
        accepted, the pre-search settle is not bounds-checked, the
        duplicate-doorway tolerance is arbitrary, a doorway is not checked to
        lie on a shared edge, chamber-rect containment is prompted but not
        enforced, and response_format is droppable."
      truncated: false
    - text: The Verifier disclosed that one of its commands carelessly included a
