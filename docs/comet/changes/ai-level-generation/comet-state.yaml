    text: "All 24 acceptance items pass, with no new correctness bug from the fix
      and nothing previously passing damaged. The suite was reproduced against
      this tree: 343 passed, 0 failed, 1 ignored — the ignored one being A23,
      the only #[ignore] in the tree. The read_known fix was hand-traced across
