  summary:
    text: "Iteration 3 - one two-line fix to a regression the iteration-2 Verifier
      flagged in its risks, nothing else changed. The iteration-2 toolbox guard
      put !pointer_over_help on the OUTER condition of the toolbox drag block,
      which suspended an already-running drag whenever the cursor crossed the
      open help window: the block stopped updating drag_start while the pointer
      was inside the rect, so on exit the toolbox jumped by the whole
      accumulated delta. The guard now sits on the inner start branch only - `if
      toolbox_rect.contains(pos) && !pointer_over_help { if
      !self.dragging_toolbox { ...start... } }` - so a press inside the help
      window still cannot BEGIN a toolbox drag (the A18 behaviour), while a drag
      already under way keeps tracking the cursor continuously across the window
      and the toolbox never jumps. The canvas click guard (help_click) and the
      right-click polygon guard are untouched, as are help.rs, the Escape
      wiring, the Help menu, the F1/? toggle and the window rendering.
