acceptance:
  - id: A1
    source: brief.md
    text: "A1 — Help menu: the menu bar shows `Help`; choosing `Help → Keyboard &
      Commands` opens the help window."
    result: passed
    reason:
      text: src/main.rs:729-735 adds ui.menu_button("Help", ...) in the same
        egui::menu::bar as File, with a single ui.button("Keyboard & Commands")
        that sets self.help_open = true and calls ui.close_menu();
        render_help_window (main.rs:739, 478-481) draws the window whenever
        help_open.
      truncated: false
  - id: A2
    source: brief.md
    text: "A2 — Key toggle: pressing `F1` opens the help window when closed and
      closes it when open; pressing `?` does the same."
    result: passed
    reason:
      text: src/main.rs:785-791 reads i.key_pressed(egui::Key::F1) ||
        i.key_pressed(egui::Key::Questionmark) and does self.help_open =
        !self.help_open, so either key opens when closed and closes when open.
      truncated: false
  - id: A3
    source: brief.md
    text: "A3 — Escape priority: with the help window open and a polygon in progress
      (or a polygon in edit mode), one press of `Escape` closes the help window
      and the polygon / edit mode is untouched; with the help window closed,
      `Escape` cancels the polygon / exits edit mode exactly as before."
    result: passed
    reason:
      text: main.rs:837-861 routes Escape through escape_action(help_open,
        drawing_polygon.is_some(), editing_polygon_entity.is_some()); the
        CloseHelp arm only clears help_open and touches no polygon state, and it
        is the sole Escape handler in the codebase. With help closed the
        CancelPolygon/ExitEditMode arms are byte-identical to the pre-change
        branches. help.rs tests both directions; both passed in the Runtime
        cargo test.
      truncated: false
  - id: A4
    source: brief.md
    text: "A4 — Non-modal window: the help window has a title-bar close button, can
      be dragged, and while it is open the arrow keys still scroll the canvas
      and clicks outside the window still reach the canvas and toolbox."
    result: passed
    reason:
      text: main.rs:500-504 uses egui::Window::new(...).open(&mut open) (title-bar
        close button; main.rs:533-536 syncs it back) and does not call
        .movable(false), so it is draggable. Arrow scrolling (main.rs:773-803)
        and all canvas/toolbox handling run every frame regardless of help_open,
        and no modal/Area-order/input-capture mechanism was added.
      truncated: false
  - id: A5
    source: brief.md
    text: "A5 — Keyboard section completeness: the Keyboard section lists entries
      for Arrow keys, Enter, Escape, Delete/Backspace, Undo, Redo, and F1 / ? —
      every key the input handler responds to — and nothing that the editor does
      not handle."
    result: passed
    reason:
      text: Every key the handler touches is arrows (main.rs:778-781), F1/Questionmark
        (786), Enter (810), Z+command/+shift (826-827), Escape (837),
        Delete/Backspace (865) - exactly the 7 rows built in help.rs:88-102,
        asserted by the exact-equality test
        keyboard_section_lists_every_handled_key_and_nothing_else, which passed.
      truncated: false
  - id: A6
    source: brief.md
    text: 'A6 — Platform modifiers: on macOS the Undo entry reads with ⌘ (e.g. "⌘Z")
      and Redo with ⇧⌘Z; on other platforms they read "Ctrl+Z" / "Shift+Ctrl+Z".
      Rendered via `egui::Context::format_shortcut`, not hard-coded strings.'
    result: passed
    reason:
      text: main.rs:483-490 builds both labels with
        ctx.format_shortcut(&KeyboardShortcut::new(Modifiers::COMMAND, Key::Z))
        and COMMAND|SHIFT; help.rs takes them as parameters and hard-codes no
        glyph (test undo_and_redo_labels_come_from_the_caller asserts no mac
        glyph when the caller passes Ctrl strings). egui 0.27.2
        context.rs:1292-1321 picks ModifierNames::SYMBOLS on mac and NAMES
        elsewhere.
      truncated: false
  - id: A7
    source: brief.md
    text: "A7 — Mouse section completeness: the Mouse section covers left click per
      tool (Select, Delete, polygon tools, bitmap tools), double-click (close
      polygon; enter vertex edit), right-click (finish polygon), drag (entity,
      vertex, toolbox), and click-outside-to-exit-edit."
    result: passed
    reason:
      text: "help.rs:104-130 has all ten rows: Select/Delete/polygon/bitmap left
        click, both double-click meanings, right-click, drag in edit mode,
        click-outside-to-exit, drag the toolbox; entity drag is stated in the
        Select-tool row. Test mouse_section_covers_every_gesture passed."
      truncated: false
  - id: A8
    source: brief.md
    text: 'A8 — Tools generated from JSON: every tool in `src/toolboxes.json`
      appears exactly once with its description and kind; `add_point_tool` and
      `remove_point_tool` carry a "not yet implemented" marker; `select_tool`
      and `delete_tool` do not. Adding a tool to the JSON makes it appear
      without a code change.'
    result: passed
    reason:
      text: help.rs:132-145 maps over the runtime-loaded ToolboxLayout.tools
        (main.rs:491-495 passes self.toolbox_layout), so a new JSON tool appears
        with no code change; is_tool_implemented (help.rs:71-73) flags only
        tool-kind names other than select_tool/delete_tool. Test
        real_toolboxes_json_yields_every_tool_exactly_once parses the real
        src/toolboxes.json and asserts one entry per tool, description present,
        and flagged == [Add point, Remove point]; it passed.
      truncated: false
