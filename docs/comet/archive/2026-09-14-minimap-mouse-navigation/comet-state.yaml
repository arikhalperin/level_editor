acceptance:
  - id: A1
    source: brief.md
    text: "A1 — Editing, level 25600×720, view at the origin: press the left button
      at the horizontal middle of the minimap → on the next frame the view is
      centred on world x ≈ 12800 (`scroll_offset.x ≈ 12800 − panel_width/2`) and
      `scroll_offset.y` is clamped to its reachable range; the yellow rectangle
      now surrounds the pressed spot."
    result: passed
    reason:
      text: minimap::offset_for_pointer maps inner.center() to world 12800 and
        centre_offset subtracts panel/2 then clamps y to 0; test
        a_press_on_the_minimap_jumps_the_view_and_kills_momentum and
        a_press_in_the_middle_centres_the_view_on_the_level_middle assert
        x≈12800−640 and y==0, and the renderer's view_rect is derived from the
        same refreshed scroll_offset so it is centred on the pressed spot.
      truncated: false
  - id: A2
    source: brief.md
    text: A2 — Press near the minimap's left / top edge (target centre less than
      half a viewport from the origin) → `scroll_offset` is exactly 0 on that
      axis, never negative. Press on the minimap's far edge → that level edge
      sits at the centre of the view (`scroll_offset = level_size −
      panel_size/2` on that axis); the offset never exceeds `level_size`, the
      same bound arrow-key scrolling has.
    result: passed
    reason:
      text: centre_offset clamps each axis to 0..=level (never negative, never past
        level_size); tests the_offset_never_goes_negative_near_the_origin,
        the_offset_never_passes_the_level_size_near_the_far_edge (off == level −
        panel/2 at the far edge, == level when far beyond) and
        dragging_across_the_thumbnail_sweeps_the_whole_level (right edge ⇒ 25600
        − 640) cover both axes.
      truncated: false
  - id: A3
    source: brief.md
    text: A3 — Press and, without releasing, drag across the minimap → the view
      follows the pointer every frame while the button is held, including when
      the pointer leaves the minimap rectangle mid-drag; releasing ends the
      gesture. A drag that started on the canvas and merely passes over the
      minimap does not move the view.
    result: passed
    reason:
      text: minimap_drag is set only on primary_pressed() over map_rect and re-applies
        layout.offset_for_pointer each frame while primary_down() (world_at
        clamps off-box positions to inner); a canvas press never sets it — tests
        the_gesture_is_consumed_through_the_release_frame_wherever_it_lands and
        a_drag_that_started_on_the_canvas_does_not_move_the_view_over_the_minimap
        pass.
      truncated: false
  - id: A4
    source: brief.md
    text: "A4 — After any minimap press or drag the scroll velocity is zero: the
      view does not glide on after the button is released, and pending arrow-key
      momentum is discarded at the moment of the press."
    result: passed
    reason:
      text: handle_minimap_pointer sets scroll.velocity = Vec2::ZERO on every drag
        frame including the press frame, and runs after self.scroll.step(...) in
        update; test asserts velocity is zero after a press that started with
        velocity (900,0).
      truncated: false
  - id: A5
    source: brief.md
    text: A5 — With the Bitmap, Polygon, Select or Delete tool active, a click on
      the minimap adds no entity, adds no polygon vertex, changes no selection
      and deletes nothing; a click on the canvas outside the minimap still
      behaves as before.
    result: passed
    reason:
      text: pointer_over_ui returns true for minimap_drag or layout.contains(pos); the
        central-panel click dispatch (spawn move, DrawPolygon, Bitmap, Select,
        Erase) and the secondary-click path are all guarded by !help_click /
        !secondary_over_help, so a minimap press reaches no tool; canvas clicks
        outside map_rect hit the unchanged code.
      truncated: false
  - id: A6
    source: brief.md
    text: A6 — While play mode is running, pressing or dragging on the minimap
      changes neither the view nor the spawn point; the camera keeps following
      the character.
    result: passed
    reason:
      text: In play mode handle_minimap_pointer performs only the gesture bookkeeping
        then returns before touching scroll.offset, while pointer_over_ui still
        consumes the click so the play-spawn branch (`self.play.is_some() &&
        !toolbox_click && !help_click`) is skipped; test
        the_minimap_ignores_the_mouse_while_playing_but_still_owns_the_spot
        covers press and an off-box release.
      truncated: false
  - id: A7
    source: brief.md
    text: A7 — Hovering the minimap while editing shows a pointing-hand cursor; a
      press does not change any level data and `has_unsaved_changes()` is
      unaffected.
    result: passed
    reason:
      text: Hovering map_rect while editing sets ctx.output_mut cursor_icon =
