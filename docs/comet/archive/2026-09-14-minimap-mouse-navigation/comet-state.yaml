  - id: A21
    source: specs/canvas-scrolling/spec.md
    text: "**Acceleration while held.** For each axis with a held direction,
      velocity accelerates toward `±MAX_SPEED` at a fixed rate `ACCEL` (px/s²),
      reaching full speed in roughly 0.25 s. `MAX_SPEED` ≥ the previous fixed
      600 px/s."
    result: passed
    reason:
      text: scroll.rs constants and step_axis are unchanged and its unit tests
        (acceleration, decay, origin stop, determinism) pass.
      truncated: false
  - id: A22
    source: specs/canvas-scrolling/spec.md
    text: "**Momentum on release.** When no key is held on an axis, that axis's
      velocity decays exponentially (`v *= exp(−DECAY · dt)`) and is snapped to
      exactly 0 once `|v|` falls below a small threshold (`STOP_SPEED`, ≈ 5
      px/s). Constants are chosen so a full-speed release comes to rest in ≤ 1.5
      s. There is no perpetual drift."
    result: passed
    reason:
      text: scroll.rs constants and step_axis are unchanged and its unit tests
        (acceleration, decay, origin stop, determinism) pass.
      truncated: false
  - id: A23
    source: specs/canvas-scrolling/spec.md
    text: "**Integration.** `offset += velocity · dt` each frame, then clamped: any
      component `< 0` is set to 0 and that axis's velocity is set to 0 (momentum
      stops at the origin; no bounce, no overshoot)."
    result: passed
    reason:
      text: scroll.rs constants and step_axis are unchanged and its unit tests
        (acceleration, decay, origin stop, determinism) pass.
      truncated: false
  - id: A24
    source: specs/canvas-scrolling/spec.md
    text: "**Determinism.** Given the same sequence of `(held_dirs, dt)` the model
      produces the same offsets; this is what the unit tests exercise."
