  - id: A16
    source: specs/canvas-scrolling/spec.md
    text: "While editing, `0 ≤ scroll_offset ≤ level_size` on each axis, where
      `level_size` is the resolved level extent (see `level-lifecycle`). The
      upper bound is exactly one screen of slack: at it, the level's far edge
      sits at the near edge of the viewport, so the user can still scroll a full
      screen past the background image or the outermost entity and place
      entities there. While play mode is running the camera owns the offset and
      may take it outside that range, including negative, so a character at
      negative world coordinates stays on screen; `ScrollModel` is not stepped
      then, and both of its clamps are unchanged."
    result: passed
    reason:
      text: scroll.rs is unchanged (git diff --stat shows no change); step clamps to
        0..=max with the resolved level size, and minimap centre_offset clamps
        to the same 0..=level; play mode still skips scroll.step.
      truncated: false
