      brief's D5 said it should be - inside ScrollModel::step_axis
      (scroll.rs:86-95) - so the far bound pins the offset and zeroes velocity
      in exactly the same branch structure as the origin clamp, and the maximum
      is a per-step parameter fed from resolved_level_size() each frame
      (main.rs:1361), which is what makes the bound track the level size live in
      both directions. Play mode is exempt because the step is skipped wholesale
      under if self.play.is_none(), and level_size::resolve guarantees at least
      1 px per axis so the range cannot invert. New Level is now the first item
      in the File menu, above Load Level, with the identical play.is_none() gate
      and the identical "Stop play mode first" disabled hover text - I
      re-checked this afresh and the previous cycle's ordering defect is gone.
      The reset itself (main.rs:283-309) is a pure in-memory assignment from
      BlankLevel, clears every field the spec lists including the open Level
      Size dialog and last_click_pos, marks the editor clean from the blank
      content's own hash, and touches no file; the Save path in the shared
      confirmation advances only on Ok(true) from a real fs::write. Test
      coverage is genuine rather than tautological where it matters -
