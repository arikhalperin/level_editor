  - id: A19
    source: specs/level-lifecycle/spec.md
    text: "The upper bound is exactly **one screen of slack**. Because the visible
      region is `offset … offset + viewport`, an offset of `level_size` places
      the level's far edge at the viewport's *near* edge, leaving a full
      viewport of empty space beyond the boundary. That space is reachable and
      usable: entities may still be created in it, and the level can then be
      enlarged through `Level → Level Size…` to take them in. Expressing the
      slack as the level size itself makes it one viewport wide at any window
      size, with no separate constant."
    result: passed
    reason:
      text: "Implemented with no viewport term at all: the max is the level size
        itself (main.rs:1361), so the slack is one viewport wide at any window
        size, and the reachable slack is usable for placement (main.rs:1742) and
        can be absorbed by the Level Size dialog (main.rs:923-927). Test
        scroll.rs:206-243 across four viewport sizes, though the assertion
        reduces algebraically to offset == level (risk)."
      truncated: false
  - id: A20
    source: specs/level-lifecycle/spec.md
    text: "Momentum behaves the same at both ends: on reaching either bound the
      offset is pinned to it and that axis's velocity is set to zero — no
      overshoot, no bounce. The bound is evaluated every step, so changing the
      level size changes the reachable area immediately, and an offset already
      past a newly shrunk maximum is pulled back to it."
    result: passed
    reason:
      text: scroll.rs:86-95 pins and zeroes velocity at both ends inside step_axis,
        and the max is a per-call parameter (scroll.rs:61) re-supplied every
        frame (main.rs:1361), so the bound is evaluated each step.
        scroll.rs:245-262 asserts an offset beyond a newly shrunk max is pulled
        back to it on the very next step with zero velocity.
      truncated: false
  - id: A21
