acceptance:
  - id: A1
    source: brief.md
    text: "A1 — Clamped: scrolling right or down stops with the offset at the
      resolved level size on that axis; scrolling left or up still stops at 0."
    result: passed
    reason:
      text: src/scroll.rs:86-95 clamps each axis to [0,max] every step, and
        src/main.rs:1361 passes self.resolved_level_size() as max while editing.
        The origin clamp is unchanged. Covered by scroll.rs:174-189
        (the_offset_never_passes_the_supplied_maximum) and scroll.rs:255-261
        (never_negative_when_holding_toward_origin_at_rest).
      truncated: false
  - id: A2
    source: brief.md
    text: "A2 — A screen of slack: at the far bound the level's edge sits at the
      near edge of the viewport, leaving a full viewport of empty space visible
      past the boundary."
    result: passed
    reason:
      text: "The maximum offset is the level size itself (main.rs:1361) and world
        points draw at p - scroll_offset (main.rs:1619,1629,1671), so at max
        offset the level's far edge maps to the screen origin and the whole
        canvas shows space past it. Test scroll.rs:206-243. Caveat recorded as a
        risk: the test's viewport term cancels algebraically, and the world
        origin is window- not panel-relative, so in y the edge sits about a
        menu-bar height above the canvas top."
      truncated: false
  - id: A3
    source: brief.md
    text: "A3 — Momentum stops cleanly: releasing an arrow key while gliding toward
      the far bound pins the offset there with zero velocity, no overshoot and
      no bounce, mirroring the origin."
    result: passed
    reason:
      text: scroll.rs:90-95 pins the offset and zeroes that axis's velocity at either
        end, inside the same step as the origin clamp. Test scroll.rs:191-204
        coasts at MAX_SPEED into the bound for 600 frames, asserting no
        overshoot, offset == level exactly and velocity == Vec2::ZERO, mirroring
        momentum_toward_origin_stops_exactly_at_zero (scroll.rs:263-275).
      truncated: false
  - id: A4
    source: brief.md
    text: "A4 — Follows the level size: enlarging the level via `Level → Level
      Size…` immediately permits scrolling further, and shrinking it reduces the
      reachable area."
    result: passed
    reason:
      text: The max is recomputed and supplied every frame (main.rs:1361 calling
        resolved_level_size at main.rs:651-656), and the Level Size dialog's OK
        writes self.level_size directly (main.rs:923-927), so the next step uses
        it. Test scroll.rs:245-262 enlarges then shrinks the bound and asserts
        an offset beyond a shrunk max is pulled straight back with zero
        velocity.
      truncated: false
  - id: A5
    source: brief.md
    text: "A5 — Placement still works past the boundary: an entity can be created in
      the slack area beyond the level edge, and the level can then be enlarged
      to include it."
    result: passed
    reason:
      text: Placement converts the click with world_pos = pos + self.scroll_offset
        (main.rs:1742) and pushes entities with no clamp against the level rect
        (main.rs:1782-1786, 1757-1763). Nothing in this change touches
        placement; enlarging afterwards is the Level Size dialog
        (main.rs:923-927), which also raises the scroll bound.
      truncated: false
  - id: A6
    source: brief.md
    text: "A6 — Play is exempt: during play the camera may put the offset outside `0
      … level_size` to keep the character on screen, and stopping play restores
      an offset inside the bound."
    result: passed
    reason:
      text: main.rs:1358-1362 steps the scroll model only if self.play.is_none(), so
        the play camera (main.rs:1351 follow_with_camera, camera.rs:77-107) may
        drive the offset anywhere including negative. stop_play restores the
        captured pre-play model (main.rs:711-714, camera.rs:110-120), which was
        in-bound, and the same frame's step re-clamps regardless.
      truncated: false
  - id: A7
    source: brief.md
    text: "A7 — Small levels: with a level smaller than the viewport the offset
      range is `0 … level_size` and never inverts."
    result: passed
    reason:
      text: level_size::resolve only returns candidates passing validate
        (MIN_LEVEL_EDGE = 1.0, level_size.rs:11,24-33,40-55), so max >= 1 px per
        axis and 0..max never inverts; scroll.rs:87 additionally floors a
        negative or non-finite max at 0. Test scroll.rs:264-277 covers 0, 1,
        negative and NaN.
      truncated: false
