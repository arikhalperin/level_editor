builder_handoff:
  candidate_id: 5971d82a-e289-4af2-8a39-d974e43278dd
  identity_provider: skill-coordinated
  builder_execution_ref: skill-coordinated:builder:e7a84c4c-fa14-4fc5-83f9-f4cb6164006f
  iteration: 1
  summary:
    text: "Full implementation of both halves, carrying forward everything from the
      previous goal cycle plus the fixes below. BOUNDED SCROLLING:
      ScrollModel::step takes a `max: Vec2` and step_axis confines each axis to
      0..=max, pinning the offset and zeroing that axis's velocity at the far
      end exactly as at the origin, so momentum stops dead rather than being
      clipped after the fact; a non-finite or negative max is treated as 0 so
      the range cannot invert. main.rs passes self.resolved_level_size() every
      editor step, so the reachable area tracks the level size live and the
      slack is exactly one viewport (the visible region is
      offset..offset+viewport, so an offset of level_size puts the level's far
      edge at the viewport's near edge). Placement is untouched. ScrollModel is
      not stepped while play is running, which is what keeps the play camera
      exempt. NEW LEVEL: src/new_level.rs is pure and holds BlankLevel (every
      field the reset clears, gathered so the reset cannot silently omit one)
      and level_hash(entities, level_size); compute_entities_hash delegates to
      it and BlankLevel::clean_hash() derives the clean marker from the blank
      content itself. EditorState::new_level() assigns from BlankLevel and also
      clears the background controller (BackgroundImageController::clear()), the
      in-flight drag/draw state, last_click_pos and any open Level Size dialog.
      `exit_requested: bool` became `pending_action: Option<PendingAction>`
      (Exit | NewLevel) so one dialog serves both, showing an action-specific
      prompt with Save / Discard / Cancel; Cancel and the window's X both
      abandon the command and change nothing. FIXES SINCE THE LAST CANDIDATE.
      (1) The New Level button now renders FIRST inside the File menu, above
      Background Image and Load Level, matching the spec's 'top of the File
      menu' wording and the order help.rs documents; its add_enabled(can_edit)
      guard and 'Stop play mode first' hover text are unchanged. (2)
      save_level() now returns Ok(true) only when a file was actually written
      and Ok(false) when the destination dialog is dismissed; the confirmation's
      Save button sets `resolved` only on a real save, so dismissing that dialog
      (or a write error) leaves the confirmation open instead of discarding
      unsaved work - the user confirmed this refinement (D8). (3)
      EditorState::new_level() now has direct automated coverage: mod
      editor_state_tests in main.rs dirties every level-bearing field (entities,
      explicit size, a really loaded background, spawn, last_click_pos,
      selection, polygon-edit state, both drags, an in-progress polygon, both
      history stacks, a scrolled and moving view, both remembered paths, an open
      size dialog), calls new_level() and asserts the whole reset, the view back
      at the origin and stationary including scroll_offset,
      has_unsaved_changes() flipping true->false, both paths cleared, and the
      first edit afterwards registering as dirty again so the clean marker is
      not a blanket 'always clean'. BackgroundImageController::clear() has its
      own test through a #[cfg(test)] has_image() observer and the bundled
      wall.png. (4) the_far_bound_leaves_exactly_one_viewport_of_slack now
      asserts the reachable offset is exactly one viewport past where a strict
      clamp (level - viewport) would stop, across four viewport sizes including
      one larger than the level - the property that distinguishes 'level plus a
      screen' from 'level' - instead of restating offset == level_size. (5)
      new_level() closes the Level Size dialog so its OK cannot re-apply the old
      level's explicit size. DELIBERATELY UNCHANGED: last_save_hash still
      defaults to 0, so a freshly launched editor still reads dirty - the user
      was asked and declined that fix, and it is pre-existing. last_level_path
      is still cleared even though save_level always prompts, since A14 is about
      the observable behaviour and a stale field would be a trap. The
      world-to-screen origin is still the window rather than the canvas panel
      (pre-existing convention). A non-finite max still means 'no scrolling',
      which is unreachable from the editor and the safer default for a bound."
    truncated: false
