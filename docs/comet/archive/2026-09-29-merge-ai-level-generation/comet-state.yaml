acceptance:
  - id: A1
    source: brief.md
    text: "Scenario: After the merge, `main` contains the generator's six modules —
      `ai_client`, `level_gen`, `traversal`, `repair`, `generate_ui` and `undo`
      — and `Level → Generate Level with AI…` appears in the menu, disabled
      while play mode runs."
    result: passed
    reason:
      text: The six modules are all present and the menu item is at main.rs:2078,
        gated by can_edit = self.play.is_none() at :2076 with a 'Stop play mode
        first' hover.
      truncated: false
  - id: A2
    source: brief.md
    text: "Scenario: The pattern work survives intact: a polygon still carries an
      optional pattern path, the gallery still remembers twelve, and `quilt`
      still synthesises a tile that wraps against itself."
    result: passed
    reason:
      text: pattern.rs and quilt.rs are byte-identical to the main parent;
        GALLERY_CAPACITY is 12 with its truncate and tests intact, and the
        polygon's pattern field survives in both the entity and the level
        format.
      truncated: false
  - id: A3
    source: brief.md
    text: "Scenario: `initial_load` performs all four startup loads — the last
      background, the last level, the pattern gallery and the remembered model
      settings — so neither side's remembered state is lost at launch."
    result: passed
    reason:
      text: "Spot-checked by the verifier from the current tree: initial_load at
        main.rs:717-722 calls all four loaders, from a single
        initial_load_done-guarded site, and is now genuinely pinned by the
        mutation table below."
      truncated: false
  - id: A4
    source: brief.md
    text: "Scenario: `start_play` prefers a level's own start, then the centre of
      the visible canvas, then the last spawn, then `(100, 100)`, so a generated
      level begins where it was proved playable from and any other level behaves
      as it did before."
    result: passed
    reason:
      text: main.rs:1288-1292 is
        level_spawn.or_else(view_centre).or(play_spawn).unwrap_or((100,100)),
        the four-step chain in that order.
      truncated: false
  - id: A5
    source: brief.md
    text: "Scenario: The help screen lists every menu item the editor offers, from
      both sides, and its exhaustive assertion passes rather than being
      relaxed."
    result: passed
    reason:
      text: help.rs:370-389 is still an exhaustive assert_eq! on the full twelve-label
        vector, including Generate Level with AI and the three pattern items,
        not relaxed to a contains.
      truncated: false
  - id: A6
    source: brief.md
    text: "Scenario: A level file round-trips a polygon's `pattern` and the level's
      `spawn` and `exit` together, and a file written before either existed
      still loads with all three absent."
    result: passed
    reason:
      text: level_data.rs covers the pattern round trip, the spawn and exit round
        trip, and files predating each loading with the fields absent; the
        editor-level save and load paths were checked to carry all three in one
        document.
      truncated: false
  - id: A7
    source: brief.md
    text: "Scenario: `cargo test` passes with both sides' tests present — at least
      273 from `main` and at least 343 from the branch, the union rather than
      either alone — and the one `#[ignore]`, the live paid model request,
      remains ignored."
    result: passed
    reason:
      text: "Spot-checked by the verifier: test-name sets are 273 on the main parent,
        344 on the branch, 416 on HEAD, with comm showing nothing from either
        parent missing. 415 pass plus 1 integration, and the single ignored test
        is still the live paid model request at level_gen.rs:2069."
      truncated: false
  - id: A8
    source: brief.md
    text: "Scenario: No test from either side is removed, renamed or weakened to
      make the merge fit."
    result: passed
    reason:
      text: "No name added or removed against the accepted tree. The one assertion
        dropped was vacuous: last_level_path == None for a missing file held
        equally when the loader never ran, which is precisely why it pinned
        nothing."
      truncated: false
  - id: A9
    source: brief.md
    text: "Scenario: `cargo build` succeeds with no warning beyond the union of the
      two baselines."
    result: passed
    reason:
      text: 15 warnings, main.rs 5, a strict subset of the iteration-1 set that was
        already verified to sit inside the parents' per-file union, so it holds
        a fortiori.
      truncated: false
  - id: A10
    source: brief.md
    text: "Scenario: The thirty uncommitted tooling files are in the same state
      after the merge as before it, and none is included in the merge commit."
    result: passed
    reason:
      text: The merge commit names five files, none under .github, .comet, .gitignore
        or .codegraph; the tooling files remain unstaged and nothing is in the
        index.
      truncated: false
