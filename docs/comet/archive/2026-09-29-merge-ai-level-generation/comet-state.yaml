      the list is true. Two additions and one correction: the background, using
      a file that is really there so the path is remembered rather than skipped;
      the pattern gallery, using a pattern file that exists so the gallery does
      not prune it on load; and the level leg, which the verifier did not flag
      and which was in fact the weakest of the four. It pointed the config at
