acceptance:
  - id: A1
    source: brief.md
    text: "A1 — Never off screen: with the character running at full speed, dashing
      at 1500 px/s, falling at terminal velocity and being knocked back, its
      capsule stays fully inside the canvas panel with at least the 24 px margin
      on every side, at every frame."
    result: passed
    reason:
      text: camera.rs:95 ends every follow() with the hard bound contain(); tests at
        camera.rs:166-213 drive PLAYER_RUN_SPEED, DASH_SPEED, MAX_FALL_SPEED and
        a real ORC_CLUB_KNOCKBACK impulse integrated under GRAVITY to terminal
        velocity, asserting on every frame that the capsule is inside
        panel.shrink(24).
      truncated: false
  - id: A2
    source: brief.md
    text: "A2 — Hard bound: teleporting the character an arbitrary distance in one
      frame still leaves it inside the safe area on that same frame — the clamp
      does not need several frames to catch up."
    result: passed
    reason:
      text: The previous defect is closed. The only path that moves the character
        after the frame's camera update is the play-mode spawn click
        (main.rs:1645-1656), which now calls contain_play_camera(play_panel)
        (main.rs:687-691) immediately after respawn_at and before draw_play
        (main.rs:1865). All other position changes - play.advance (main.rs:1266,
        including death->restart at combat.rs:812-815 and knockback) and R
        restart (main.rs:1251-1255) - run before follow_with_camera
        (main.rs:1270). Tests
        a_single_frame_teleport_cannot_escape_the_safe_area (jumps to 1e6) and
        contain_catches_a_teleport_applied_after_the_frames_follow confirm the
        bound is single-frame.
      truncated: false
  - id: A3
    source: brief.md
    text: "A3 — Feel preserved inside the safe area: while the character is well
      within the viewport the camera still ignores horizontal movement under the
      40 px dead zone and converges at the game's rates, with the Y rate
      multiplied by 2.5 once descent passes 400 px/s."
    result: passed
    reason:
      text: "camera.rs:82-93 is a literal transcription of the previous main.rs logic:
        dead zone test, k = 1-exp(-rate*dt), rate_y *= 2.5 when vel.y > 400.
        Tests camera.rs:228-291 assert exact no-motion inside the dead zone, the
        exponential value to 0.01, and the catch-up ratio, with the setup helper
        asserting it sits inside the safe area so the clamp is not what is
        measured."
      truncated: false
  - id: A4
    source: brief.md
    text: "A4 — Centres on the panel: given a panel that starts below a menu bar,
      the camera's resting target puts the character at the panel's centre
      (offset by `CAMERA_OFFSET_Y`), not the window's."
    result: passed
    reason:
      text: target_offset uses panel.center() (camera.rs:41-47) and main.rs:1259
        passes ctx.available_rect(), which egui shrinks by the menu bar
        allocated at main.rs:1105 (egui frame_state.rs allocate_top_panel). Test
        camera.rs:295-306 asserts screen == panel centre + (0, CAMERA_OFFSET_Y)
        for a panel starting at y=24, which the old window-based maths would
        fail.
      truncated: false
  - id: A5
    source: brief.md
    text: "A5 — Past the origin: with the character at negative world coordinates
      the camera follows into negative scroll offset and the character remains
      on screen."
    result: passed
    reason:
      text: No max(0.0) survives in the camera path, and ScrollModel::step - the only
        other origin clamp - is skipped while playing (main.rs:1267-1269). Test
        camera.rs:322-334 drives a character at (-4000,-3000) to a negative
        offset on both axes and asserts it is on screen.
      truncated: false
  - id: A6
    source: brief.md
    text: "A6 — Editing unchanged: with play stopped, the editor's scroll offset
      still cannot go below zero on either axis."
    result: passed
    reason:
      text: src/scroll.rs is untouched and step_axis still clamps pos<0 to 0
        (scroll.rs:79-83). The skip at main.rs:1267-1269 is gated on
        play.is_none(), so with play stopped step runs exactly as before; the
        existing scroll tests still cover it.
      truncated: false
  - id: A7
    source: brief.md
    text: "A7 — View restored: scroll somewhere, press `F5`, let the character run
      far away, press `F5` again — the canvas is back at exactly the offset it
      had before play started."
    result: passed
    reason:
      text: start_play captures at main.rs:631 and stop_play restores at
        main.rs:646-649 via camera::restore, which assigns the whole saved
        struct; scroll_offset is refreshed immediately. On the stop frame
        ScrollModel::step then runs, but with velocity zeroed and a non-negative
        saved offset it is a no-op, so the offset returns bit-exact. Test
        camera.rs:373-388 asserts the exact f32 offset after the camera dragged
        it to (-9000,-7500).
      truncated: false
  - id: A8
    source: brief.md
    text: "A8 — No leftover momentum: the restored view is stationary even if the
      canvas was mid-glide when play began."
    result: passed
    reason:
      text: camera::restore sets velocity to ZERO after assigning the snapshot
        (camera.rs:107-108); test camera.rs:386-387 asserts it after restoring a
        model captured mid-glide at (-300, 90).
      truncated: false
  - id: A9
    source: brief.md
    text: "A9 — Either route: stopping from the `Play` menu restores the view
      exactly as `F5` does."
    result: passed
    reason:
      text: The Play menu item (main.rs:1161-1167) and the F5 handler
        (main.rs:1236-1238) both call toggle_play, the only caller of stop_play
        (main.rs:654-660); the restore lives inside stop_play, so the routes are
        identical by construction.
      truncated: false
  - id: A10
    source: brief.md
    text: "A10 — Only stopping restores: pressing `R`, dying, or clicking to move
      the spawn leaves the camera following the character; none of them restores
      the pre-play view."
    result: passed
    reason:
      text: view_before_play appears at only four sites (main.rs:114, 170, 631, 646).
        The R handler calls play.restart() only; death respawn happens inside
        play.advance; the spawn click calls respawn_at and sets
        play_spawn/last_click_pos. None touches view_before_play or self.play.
      truncated: false
  - id: A11
    source: brief.md
    text: "A11 — Re-entry re-captures: after stopping, scrolling elsewhere and
      entering play again, stopping restores the newer position rather than the
      first one."
    result: passed
    reason:
      text: start_play assigns view_before_play unconditionally on every entry
        (main.rs:631) and stop_play consumes it with .take() (main.rs:646), so a
        second entry stores the newer ScrollModel.
      truncated: false
  - id: A12
    source: brief.md
    text: "A12 — Still non-destructive: a play session that moves the camera far
      from the origin leaves the level's entities and `has_unsaved_changes()`
      untouched."
    result: passed
    reason:
      text: The diff touches only scroll state and camera wiring; during play every
        editor command is gated by editing = play.is_none() (main.rs:1287) and
        the canvas click takes the play branch that mutates only
        play_spawn/last_click_pos. has_unsaved_changes is a function of the
        entity hash alone, so no scroll offset can affect it.
      truncated: false
  - id: A13
    source: specs/play-camera/spec.md
    text: Complete target behaviour of the camera that follows the character in play
      mode. It extends the `play-simulation` capability, which owns the
      character, the spawn point and the fixed timestep, and amends the
      `canvas-scrolling` capability's origin invariant as noted below.
    result: passed
    reason:
      text: "camera.rs depends on game_config and ScrollModel, and the delta spec
        states the canvas-scrolling amendment. Factual note:
        docs/comet/specs/canvas-scrolling/spec.md:10 still reads 'always' and is
        contradicted during play; the builder states it will be amended at
        archive time."
      truncated: false
  - id: A14
    source: specs/play-camera/spec.md
    text: The character's on-screen position is `world − scroll_offset`. The
      camera's job is to choose `scroll_offset` each frame so that position
      falls inside the canvas panel.
    result: passed
    reason:
      text: camera::screen_pos is pos - offset (camera.rs:32-34), the camera chooses
        scroll.offset each frame (main.rs:693), and draw_play positions the
        capsule through the same helper (main.rs:701), so contained and drawn
        coordinates cannot drift apart.
      truncated: false
  - id: A15
    source: specs/play-camera/spec.md
    text: "Each frame the camera aims to put the character at the **canvas panel's**
      centre, offset by `CAMERA_OFFSET_Y` 80 so the character sits below it, and
      converges on that target with per-second exponential smoothing, `k = 1 −
      exp(−rate · dt)`:"
    result: passed
    reason:
      text: target_offset subtracts CAMERA_OFFSET_Y on Y in Y-down space so the
        character sits below the panel centre (camera.rs:41-47), and both axes
        use k = 1-exp(-rate*dt).
      truncated: false
  - id: A16
    source: specs/play-camera/spec.md
    text: "| Axis | Behaviour |"
    result: passed
    reason:
      text: Structural table header; the two rows are implemented in camera::follow
        (camera.rs:82-93) and judged at A17/A18.
      truncated: false
  - id: A17
    source: specs/play-camera/spec.md
    text: "| X | Ignored entirely while the target is within `CAMERA_DEAD_ZONE_X` 40
      of the current offset; otherwise converges at `CAMERA_FOLLOW_RATE_X` 7. |"
    result: passed
    reason:
      text: camera.rs:83-86 skips the X update entirely unless |dx| >
        CAMERA_DEAD_ZONE_X and otherwise applies rate 7. Test camera.rs:229-242
        asserts exact equality at 39 px and motion at 80 px.
      truncated: false
  - id: A18
    source: specs/play-camera/spec.md
    text: "| Y | Converges at `CAMERA_FOLLOW_RATE_Y` 5, multiplied by
      `CAMERA_FALL_CATCHUP_MULT` 2.5 once the character descends faster than
      `CAMERA_FALL_SPEED_THRESHOLD` 400 px/s. |"
    result: passed
    reason:
      text: camera.rs:88-93 multiplies rate 5 by 2.5 when vel.y > 400 - the correct
        sign for Y-down descent. Test camera.rs:269-291 checks both sides of the
        threshold and the exact k ratio.
      truncated: false
  - id: A19
    source: specs/play-camera/spec.md
    text: "The centre is taken from the panel rectangle, not from the window: the
      panel sits below the menu bar, so centring on the window would bias the
      character downward by the menu bar's height."
    result: passed
    reason:
      text: "panel.center() is used, and main.rs:1263 passes ctx.available_rect()
        captured after the menu panel and before CentralPanel. Hoisting it out
        of the play block did not change its value: egui only shrinks
        available_rect when a panel is allocated (frame_state.rs:127-166),
        nothing between the old and new call sites adds one, and Window/Area
        explicitly do not. CentralPanel::show reads the same rect, so play_panel
        is exactly the canvas the character is drawn into."
      truncated: false
  - id: A20
    source: specs/play-camera/spec.md
    text: After the smoothing, the offset is clamped so the character's capsule —
      `PLAYER_CAPSULE_RADIUS` 25 either side, `PLAYER_CAPSULE_HALF_EXTENT_Y` 45
      above and below — lies wholly inside the panel inset by
      `CAMERA_SAFE_MARGIN` 24 px on every side.
    result: passed
    reason:
      text: "half_extents() is (25, 45) and containment insets by panel.shrink(24).
        Checked against the drawn body: draw_play paints a rect of +/-25 x +/-20
        plus radius-25 circles at +/-20, i.e. exactly +/-25 by +/-45, so the
        contained extents match what is drawn (the 2 px head stroke adds ~1 px,
        absorbed by the margin)."
      truncated: false
  - id: A21
    source: specs/play-camera/spec.md
    text: Writing the inset panel as `safe`, the offset is bounded by
    result: passed
    reason:
      text: "Derived independently from screen = pos - offset: screen.x + half.x <=
        safe.max.x gives offset.x >= pos.x - safe.max.x + half.x, and the mirror
        for the lower edge. camera.rs:55-56 is that expression verbatim on both
        axes with correct signs."
      truncated: false
  - id: A22
    source: specs/play-camera/spec.md
    text: "This is a bound rather than a spring, so it holds on the frame it is
      needed: no speed, and no discontinuous jump in the character's position,
      can put the character outside the safe area even for one frame. Inside the
      safe area the clamp never binds and the smoothing above is the only thing
      acting."
    result: passed
    reason:
      text: "contain (camera.rs:104-107) is a pure clamp applied unconditionally at
        the end of follow and again at the one late-teleport site
        (main.rs:1655). I enumerated every path that can change position or
        offset after the frame's camera update and before draw_play at
        main.rs:1865: advance, death->restart and R restart all precede
        follow_with_camera; the frame play starts still runs follow that frame;
        the frame play stops draws no character (draw_play early-returns); a
        panel resize is absorbed because play_panel is re-read each frame; and
        the only remaining offset writes in the file are lines
        631/647-648/689-690/701-702/1278/1280, none between main.rs:1655 and the
        draw. Inside the safe area contain is a no-op (test camera.rs:247-258)."
      truncated: false
  - id: A23
    source: specs/play-camera/spec.md
    text: If the panel is smaller than the character plus its margins on an axis,
      the bound inverts; the character is then centred on that axis instead.
    result: passed
    reason:
      text: camera.rs:57-66 collapses each inverted axis to mid = pos - safe.center(),
        and Rect::shrink preserves the centre. Test camera.rs:338-350 uses a
        40x40 panel and asserts lo == hi and the character within 1 px of the
        panel centre.
      truncated: false
  - id: A24
    source: specs/play-camera/spec.md
    text: Only the character is contained. The floating toolbox and the play overlay
      may overlap it.
    result: passed
    reason:
      text: contain/containment_bounds take only the character's pos; nothing
        subtracts the toolbox or overlay rects. Both are drawn as ordinary
        content inside the same CentralPanel with no effect on available_rect,
        so they may overlap and the camera never reacts to the toolbox being
        dragged.
      truncated: false
  - id: A25
    source: specs/play-camera/spec.md
    text: "While play mode is running the camera owns the scroll offset outright and
      may take it **negative**, so a character at negative world coordinates is
      still shown. The editor's `ScrollModel` is not stepped during play, which
      is what allows this: the model's own origin clamp is unchanged and would
      otherwise reapply every frame."
    result: passed
    reason:
      text: "main.rs:1263-1269 wraps ScrollModel::step in play.is_none(), and
        follow_with_camera writes scroll.offset with no lower bound. I checked
        what else step does: it only accelerates/decays velocity, integrates and
        clamps the origin, so skipping it has no other side effect - held is
        already default during play, follow zeroes velocity so needs_repaint
        stays false, and play requests its own repaint."
      truncated: false
  - id: A26
    source: specs/play-camera/spec.md
    text: This amends the `canvas-scrolling` capability, which states that
      `scroll_offset.x ≥ 0` and `scroll_offset.y ≥ 0` at all times. That
      invariant holds **while editing**; the play camera is its one exception.
      With play stopped, editor scrolling still cannot pass the origin in either
      axis.
    result: passed
    reason:
      text: "Behaviourally correct: the origin clamp is intact and runs on every
        non-play frame, and the restored offset is the pre-play non-negative
        one. Factual report: the main canvas-scrolling spec still says 'always'
        and is contradicted today; the amendment is deferred to archive time."
      truncated: false
  - id: A27
    source: specs/play-camera/spec.md
    text: Entering play captures the editor's scroll state — offset and momentum.
      Stopping play restores that offset exactly and clears momentum, so the
      canvas returns to where the user left it and does not drift on.
    result: passed
    reason:
      text: camera::capture returns a copy of the whole ScrollModel including velocity
        (ScrollModel is Copy) and restore writes it back then zeroes velocity;
        wired at main.rs:631 and 646-649. Test camera.rs:390-396 pins that the
        snapshot does not alias.
      truncated: false
  - id: A28
    source: specs/play-camera/spec.md
    text: "Restoring happens on every route out of play: the `F5` shortcut and `Play
      → Stop` both go through the same path. Restarting the run with `R`, dying,
      and clicking to move the spawn all leave the camera following the
      character; only stopping restores. Entering play again captures the view
      afresh, so the restored position is always the one from the most recent
      entry."
    result: passed
    reason:
      text: Both exits share stop_play; R, death and spawn clicks never reach it;
        re-entry re-captures. Judged by wiring inspection - there is no
        automated test for these call sites.
      truncated: false
  - id: A29
    source: specs/play-camera/spec.md
    text: The camera is a pure module with no egui `Context` or `Ui`, taking the
      current offset, the character's position and velocity, the panel rectangle
      and `dt`, and returning the new offset, so containment is unit-testable
      headlessly at any speed. Capturing and restoring the editor's view are
      pure helpers over `ScrollModel` in the same module. `main.rs` supplies the
      panel rectangle and owns when play starts and stops.
    result: passed
    reason:
      text: camera.rs imports only egui::{Pos2, Rect, Vec2} plus game_config and
        ScrollModel - no Context or Ui - and follow's signature is (offset, pos,
        vel, panel, dt) -> Vec2. capture/restore are pure helpers in the same
        module; main.rs supplies the panel rect and owns start/stop. The 18
        tests are headless.
      truncated: false
  - id: A30
    source: specs/play-camera/spec.md
    text: A1 — The character's capsule stays fully inside the inset panel at run,
      dash, terminal-fall and knockback speeds.
    result: passed
    reason:
      text: "Same as A1: the bound at camera.rs:95 plus the five constant-velocity and
        impulse tests, each asserting containment every frame. The new
        load-bearing test drives 120,000 px/s, which escapes the safe area on
        the first frame without the bound, and separately asserts the
        smoothing-only path would have lost the character."
      truncated: false
  - id: A31
    source: specs/play-camera/spec.md
    text: A2 — A single-frame teleport of any distance still leaves the character
      inside the safe area that frame.
    result: passed
    reason:
      text: "Same evidence as A2. Re-checked that the spawn-click path is closed at
        main.rs:1655 and that the corner-teleport test reproduces the real
        geometry: main.rs computes spawn = pos + scroll_offset and the test
        computes teleported = corner + offset, then applies the same contain
        call. Rounding to pixel_offset is separately covered."
      truncated: false
  - id: A32
    source: specs/play-camera/spec.md
    text: A3 — Inside the safe area the dead zone and the game's smoothing rates,
      including the fall catch-up, are unchanged.
    result: passed
    reason:
      text: "Same as A3: the dead zone, both rates and the fall catch-up are
        byte-for-byte the previous logic, and the clamp is provably inert inside
        the safe area."
      truncated: false
  - id: A33
    source: specs/play-camera/spec.md
    text: A4 — The resting target centres the character on the panel, not the window.
    result: passed
    reason:
      text: "Same as A4: target_offset centres on panel.center() and the caller passes
        the post-menu-bar available_rect."
      truncated: false
  - id: A34
    source: specs/play-camera/spec.md
    text: A5 — A character at negative world coordinates is followed into negative
      scroll offset and stays on screen.
    result: passed
    reason:
      text: "Same as A5: no origin clamp remains in the play path and the
        negative-coordinate test asserts both a negative offset and
        containment."
      truncated: false
  - id: A35
    source: specs/play-camera/spec.md
    text: A6 — With play stopped, editor scrolling still cannot pass the origin.
    result: passed
    reason:
      text: "Same as A6: ScrollModel and its clamp are unchanged and skipped only
        while playing."
      truncated: false
  - id: A36
    source: specs/play-camera/spec.md
    text: A7 — Stopping play restores the exact pre-play scroll offset.
    result: passed
    reason:
      text: "Same as A7: stop_play restores the exact captured offset and the
        subsequent step is a no-op."
      truncated: false
  - id: A37
    source: specs/play-camera/spec.md
    text: A8 — The restored view has no momentum.
    result: passed
    reason:
      text: "Same as A8: restore explicitly zeroes velocity."
      truncated: false
  - id: A38
    source: specs/play-camera/spec.md
    text: A9 — Both the `F5` and menu routes restore.
    result: passed
    reason:
      text: "Same as A9: F5 and the Play menu both funnel through toggle_play ->
        stop_play."
      truncated: false
  - id: A39
    source: specs/play-camera/spec.md
    text: A10 — `R`, death and spawn clicks do not restore.
    result: passed
    reason:
      text: "Same as A10: none of the three paths touches view_before_play or clears
        self.play."
      truncated: false
  - id: A40
    source: specs/play-camera/spec.md
    text: A11 — Re-entering play captures the view again.
    result: passed
    reason:
      text: "Same as A11: start_play overwrites the snapshot on every entry and
        stop_play consumes it."
      truncated: false
  - id: A41
    source: specs/play-camera/spec.md
    text: A12 — Play remains non-destructive.
    result: passed
    reason:
      text: "Same as A12: no entity-mutating path is reachable during play and
        has_unsaved_changes is a pure function of the entity hash."
      truncated: false
