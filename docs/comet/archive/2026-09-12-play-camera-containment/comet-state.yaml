  summary:
    text: "Iteration 2 - repairs A2/A22/A31 and clears the two test-strength risks.
      THE DEFECT WAS REAL and the Verifier's trace of it was exact: the
      play-mode spawn click teleports the character after the frame's camera
      update (main.rs, follow runs at the play block; the click is handled much
      later inside the CentralPanel; drawing later still), so a click near a
      canvas edge drew the capsule outside the safe area for that one frame.
      FIX: camera.rs now exposes `contain(offset, pos, panel)` - the bound with
      no smoothing - which `follow` ends with, and which is applied on its own
      after any discontinuous move. main.rs hoists the canvas rectangle into
      `play_panel` before the play block so the frame's follow and any later
      re-bind measure against exactly the same area, and a new
      `contain_play_camera(panel)` helper re-applies the bound and refreshes
      scroll_offset immediately after `respawn_at` in the spawn-click branch.
      The character therefore cannot be off screen on any frame, including the
      one it is teleported on. RISKS CLEARED: the Verifier was right that the
      speed tests never engaged the clamp - at dash speed the pre-existing
      smoothing already holds the character ~223 px from centre against 591 px
      of headroom, so those tests would have passed with the bound deleted. A
      new test drives the character at 120,000 x 90,000 px/s, far beyond
      anything the follow rate can track, asserts containment every frame, and
      additionally asserts that the smoothing alone (computed alongside) WOULD
      have lost the character - so it fails if the bound is removed. Two more
      tests pin `contain` directly: that it is the bound alone and idempotent,
      and that it rescues a teleport into each of the four canvas corners, which
      is the spawn-click case in miniature. The knockback test now applies a
      real club impulse and then integrates gravity to terminal velocity instead
      of holding a constant velocity for two seconds. Full acceptance list
      rechecked; A1-A41 all addressed."
    truncated: false
