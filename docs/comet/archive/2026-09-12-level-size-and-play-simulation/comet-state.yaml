  - id: A24
    source: specs/level-size/spec.md
    text: "The level has an extent in world pixels, anchored at the top-left origin
      (0, 0) and running to (width, height). It is resolved in this priority
      order: the explicitly set size, else the loaded background image's size,
      else the bounding box of all entities, else the 1920×1080 default. A size
      is valid only when both components are finite and within 1 … 1 000 000 px;
      anything else is refused and the previous size kept."
    result: passed
    reason:
      text: level_size.rs:41-55 uses and_then(validate) at each step so an invalid
        candidate falls through; two tests cover edges.
      truncated: false
  - id: A25
    source: specs/level-size/spec.md
    text: A `Level` menu in the menu bar carries a `Level Size…` item that opens a
      modal dialog. The dialog pre-fills Width and Height from the currently
      resolved size and offers OK and Cancel. OK applies a valid size and
      closes; an invalid entry leaves the size unchanged. Cancel closes without
      applying. The dialog is the only way to change the size in this capability
      — there is no drag handle on the canvas.
    result: passed
    reason:
      text: Level menu -> Level Size... (main.rs:1033-1040) opens a Window pre-filled
        from the resolved size; OK applies only a valid size, Cancel closes
        without applying (main.rs:698-760); pointer_over_panels returns true
        whenever size_dialog.is_some() so canvas clicks are blocked and
        F1/F5/editing keys are gated (main.rs:1109,1158); the rect persists
        through the closing frame; no drag handle exists.
      truncated: false
  - id: A26
    source: specs/level-size/spec.md
    text: The level boundary is drawn on the canvas as a thin outline from world (0,
      0) to (width, height), offset by the shared scroll pixel offset like every
      other element, so it scrolls with the level and marks the editable area.
    result: passed
    reason:
      text: main.rs:1315-1321 uses the shared rounded pixel offset.
      truncated: false
  - id: A27
    source: specs/level-size/spec.md
    text: The minimap computes its thumbnail area and viewport rectangle against the
      resolved level size.
    result: passed
    reason:
      text: main.rs:1659-1666 drives thumbnail and viewport scale from the resolved
        extent.
      truncated: false
  - id: A28
    source: specs/level-size/spec.md
    text: The size does **not** clamp scrolling. The canvas still scrolls
      arbitrarily far right and down, and entities may still be placed beyond
      the boundary, preserving the behaviour confirmed in the
      two-axis-smooth-scrolling change; the boundary is a marker, and the level
      can be grown afterwards to take in what was placed outside it.
    result: passed
    reason:
      text: No clamp added; boundary is draw-only.
      truncated: false
  - id: A29
    source: specs/level-size/spec.md
    text: "`LevelData` carries `level_size: Option<[f32; 2]>`, serialised on save
      when a size has been set and read back on load. The field is optional with
      a serde default, so a level file written before this change loads
      unchanged and without error, falling back through the resolution order
      above."
    result: passed
    reason:
      text: "level_data.rs:19-21 #[serde(default)] Option<[f32;2]>. Minor: no
        skip_serializing_if, so level_size: null is written when unset (same
        convention as background_size)."
      truncated: false
  - id: A30
    source: specs/level-size/spec.md
    text: Consumers of the level JSON outside this editor must read the height from
      `level_size` rather than assuming a fixed viewport height. The Bevy game
      at `/Users/arikha/bevy_prince_platformer` currently flips editor Y with
      the hard-coded constant `LEVEL_JSON_VIEWPORT_HEIGHT = 720.0` in
      `src/game/config.rs`, so any level whose height is not 720 will be
      vertically offset there until that constant is replaced by the value from
      the file. Making that change in the game is out of scope for this
      capability; writing the field correctly is not.
    result: passed
    reason:
      text: Documented in level_data.rs:14-21 and game_config.rs:16-19; the bevy repo
        is untouched by this change.
      truncated: false
