  summary:
    text: "Iteration 4 - repairs A9/A41/A62 and A10/A42/A63 at their shared root,
      plus two Verifier risks. ROOT CAUSE: the CentralPanel click handler acts
      on raw pointer.primary_clicked() and previously excluded only the toolbox
      rect and the two floating-panel rects, so the click that activates ANY
      menu item (Play/Stop being the newly visible case) was also delivered to
      the canvas in the same frame - on entry it moved the spawn to the menu
      item's screen position, on exit it ran the restored tool's action there.
      FIX, applied once for every menu rather than per item:
      pointer_over_ui(ctx, pos) now returns true when (a) a floating panel owns
      the point or the Level Size dialog is open (unchanged, now factored into
      pointer_over_panels), (b) the point is inside the menu bar, whose rect is
      captured from the TopBottomPanel's response each frame into menu_bar_rect,
      (c) ctx.layer_id_at(pos) reports any non-Background layer - egui paints
      dropdown menus in Order::Foreground and windows in Order::Middle, so an
      open dropdown, the help window and the dialog are all covered generically
      - or (d) a menu item was activated this frame. Case (d) exists because
      egui closes the dropdown in the same frame it reports the item click, so
      at the moment the canvas handler runs the Foreground layer is already
      gone; every menu item's `.clicked()` branch (Background Image, Load Level,
      Save Level, Exit, Level Size..., Play/Stop, Keyboard & Commands) therefore
      sets a per-frame latch ui_consumed_click, reset at the start of update
      before the bar is drawn. The canvas primary-click handler and the
      right-click polygon finalise both use pointer_over_ui(ctx, pos); the
      toolbox drag guard deliberately keeps the narrower pointer_over_panels,
      because the toolbox is itself an egui Area (Order::Middle) and the layer
      test would otherwise block dragging it. Net effect: Play and Stop via the
      menu now behave identically to F5 - entry spawns at the last canvas click,
      exit performs no canvas action - and the same holds for every other menu
      item, which fixes the pre-existing class the Verifier identified rather
      than only the two symptoms. Nothing is over-blocked: with no dropdown open
      and the pointer over the canvas, layer_id_at returns the Background panel
      layer and pointer_over_ui reduces to the previous rect tests. RISKS
      CLEARED: CAMERA_OFFSET_Y sign - the game's camera.rs aims goal_y =
      player.y + 80 in a Y-up world, i.e. the player sits 80 px BELOW screen
      centre; in the editor's Y-down space that is a subtraction, and
      follow_with_camera now subtracts, with a comment deriving it.
      Unsaved-changes - compute_entities_hash now also hashes level_size, so
      changing the level size counts as an unsaved change and Exit prompts to
      save it; load_level_from_path and save_level both take their hash after
      level_size is set, so a freshly loaded or saved level still reads as
      clean, and play mode never touches level_size so A10/A42/A63 are
