  - id: A39
    source: specs/play-simulation/spec.md
    text: Play mode drops a controllable character into the level currently being
      edited so its geometry can be tested without exporting to the game.
      Movement reproduces the platformer at
      `/Users/arikha/bevy_prince_platformer`, whose character is a `bevy-tnua`
      0.31 floating controller on `bevy_rapier2d` 0.33. That controller is a
      Bevy-ECS physics plugin and cannot run inside an egui application, so the
      behaviour here is an independent kinematic reimplementation driven by that
      project's own tuning constants, transcribed from `src/game/config.rs` with
      their original names and cited source. Trajectories are close to the
      game's, not bit-identical; the constants are exact.
    result: passed
    reason:
      text: "I diffed every transcribed constant against the game's config.rs: GRAVITY
        1400, capsule 20/25, run 600/4500/3200, coyote 0.12, free-fall 500, fast
        fall 1.8, max fall 950, jump 365/9000/900, buffer 0.1, air jumps 0, dash
        1500/450/0.4/1/0.1, wall sensor radius+10, wall slide 110, wall jump
        190/170/0.18, wall coyote 0.1, climb 140/60, camera 7/5/2.5/400/40/80,
        viewport 720 - all exact."
      truncated: false
  - id: A40
    source: specs/play-simulation/spec.md
    text: A `Play` menu carries a `Play / Stop` item, and `F5` is its shortcut;
      either toggles play mode. Entering spawns the character; leaving removes
      it and returns the editor to the tool, selection and input handling it had
      before. `R` respawns the character at the spawn point. Toggles are ignored
      while a text field wants keyboard input.
    result: passed
    reason:
      text: Play menu (main.rs:994-999) and F5 (1066-1068) both call toggle_play;
        start_play/stop_play spawn and remove the character and restore tool +
        current_tool_name; R respawns (1069-1073). F5 and R sit inside
        !ctx.wants_keyboard_input() (main.rs:1058).
      truncated: false
  - id: A41
    source: specs/play-simulation/spec.md
    text: The spawn point is the last canvas click position in world coordinates, or
      (100, 100) when nothing has been clicked. A left click during play moves
      the spawn point and respawns there rather than acting on the level.
    result: passed
    reason:
      text: "start_play: last_click_pos or (100,100) (main.rs:599-602); canvas click
        during play only sets play_spawn/last_click_pos and respawn_at
        (main.rs:1507-1515), never falling into the tool match; the Play menu
        click is absorbed by the ui_consumed_click latch."
      truncated: false
  - id: A42
    source: specs/play-simulation/spec.md
    text: Play mode never modifies the level. While playing, entity placement,
      selection, dragging, deletion and polygon vertex editing are all disabled;
      no code path calls `save_state()`; the entity list is unchanged across a
      play session; and `has_unsaved_changes()` is unaffected by entering,
      playing or leaving. Play state is never serialised into the level file.
    result: passed
    reason:
      text: "Audited every save_state() call site
        (main.rs:1163,1235,1332,1360,1522,1553,1650,1711 and
        load_level_from_path): each is gated by editing, play.is_none(), cleared
        drag flags, or the disabled Load Level item; LevelData carries no play
        fields; start_play/stop_play do not touch entities, level_size or
        last_save_hash, via menu or F5."
      truncated: false
  - id: A43
    source: specs/play-simulation/spec.md
    text: "Collision is taken from the level's polygon entities, mirroring
      `world_objects::spawn_polygon_collider` in the game: every polygon entity
      is solid, and a polygon whose type is `wall_tool` is additionally
      climbable. The game builds each polygon as a `Collider::convex_hull`, so a
      concave polygon drawn in the editor collides as its convex hull here too.
      Bitmap entities are not solid — the game gives them their own behaviour
      (orcs, coins, death pits), which is out of scope."
    result: passed
    reason:
      text: collision_world (main.rs:540-551) matches level1.rs:130 and
        world_objects.rs:35; CollisionPoly::new runs a monotone-chain hull
        mirroring Collider::convex_hull; bitmaps excluded.
      truncated: false
  - id: A44
    source: specs/play-simulation/spec.md
    text: The character is a capsule with `PLAYER_CAPSULE_HALF_HEIGHT` 20 and
      `PLAYER_CAPSULE_RADIUS` 25, drawn as a plain shape with no sprite or
      animation. It never tunnels through a polygon, including at maximum fall
      speed.
    result: passed
    reason:
      text: draw_play uses the 20/25 capsule with no sprite; collision uses the same
        capsule; sub-step cap prevents tunnelling.
      truncated: false
  - id: A45
    source: specs/play-simulation/spec.md
    text: "The simulation works directly in the editor's world space: top-left
