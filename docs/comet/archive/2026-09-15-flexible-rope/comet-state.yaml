      θ)` and the hand link (the one at arc length `L`, inserted or moved to
      that arc length) at the hold position; the links beyond the hand run free,
      hanging from the hand and lagging the swing."
    result: passed
    reason:
      text: "step_held pins every link with arc <= hold on anchor+dir(theta)*s and
        constrains the first free link to the hand at rest distance (arc-hold),
        so the rope passes through the hands; the remaining links integrate
        freely (probe: taut deviation 0.00000 px, tail segments within 0.02%)."
      truncated: false
