    result: passed
    reason:
      text: the_tail_lags_behind_the_swing passes, and my independent probe from a
        real grab plus pump (no hand-set shape) measured tail.x - hand.x =
        -168.2 px at the fastest +x moment, so the lag is emergent, not an
        artefact of the test's starting shape.
      truncated: false
