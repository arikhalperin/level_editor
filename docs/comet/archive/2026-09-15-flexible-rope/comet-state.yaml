acceptance:
  - id: A1
    source: brief.md
    text: A1 — A 300 px rope is a chain of `ROPE_SEGMENT_LEN` 16 px links (19
      segments); after any number of steps every segment's length is within 2%
      of its rest length and the first link is exactly at the anchor.
    result: passed
    reason:
      text: Test a_rope_is_a_chain_of_sixteen_px_links_pinned_at_the_anchor asserts 19
        segments for the 300 px rope, anchor pin and total length; my own probes
        measured worst segment error 0.11% free, 0.02% on the held tail, and
        0.00 px on the taut part (the one link-to-link pair straddling the hand
        splits exactly into the two hand sub-segments the spec's inserted hand
        link defines, summing to rest length within 0.018%).
      truncated: false
  - id: A2
    source: brief.md
    text: "A2 — A free rope at rest hangs straight down. Displaced so its tail is
      120 px to the side and released, it swings and ripples, then settles:
      within 6 s every link's speed is below `ROPE_SETTLE_SPEED` 2 px/s and the
      chain hangs straight again (all links within 1 px of the anchor's x)."
    result: passed
    reason:
      text: a_displaced_free_rope_ripples_and_settles_straight passes (tail swings
        across, anchor fixed, segments intact); my probe measured resting
        reached at t=2.64 s, final max |x-anchor.x| = 0.0000 px and max link
        speed 0 px/s.
      truncated: false
  - id: A3
    source: brief.md
    text: A3 — While held at hold length L, the links from the anchor to the hand
      lie on the straight line `anchor + s·dir(θ)` (within 0.5 px) and the hand
      link is at the hold position; the links below the hand hang from it.
    result: passed
    reason:
      text: RopeChain::step_held pins every link with arc <= hold at anchor+dir*s; my
        probe over a 3 s swing measured max taut deviation 0.00000 px, hand
        exactly at anchor+dir(theta)*L, and the first free link held (s-L) from
        the hand within 0.0015 px.
      truncated: false
