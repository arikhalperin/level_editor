  - id: A30
    source: specs/rope-swing/spec.md
    text: "Every rope is a chain of `n = max(3, round(length / ROPE_SEGMENT_LEN))`
      links of rest length `length / n`, positions `p_0 ..= p_n` with `p_0`
      pinned at the anchor. Chain state is play state: it starts hanging
      straight when play starts or restarts and is never level data."
    result: passed
    reason:
      text: RopeChain::hanging computes n = max(3, round(length/ROPE_SEGMENT_LEN)) and
        seg_len = length/n with p0 at the anchor (probe-confirmed for five
        lengths); chains live only in Simulation::rope_chains, are rebuilt by
        sync_ropes and are never serialised.
      truncated: false
  - id: A31
    source: specs/rope-swing/spec.md
    text: "Each fixed step, for every link that is not pinned: `v = (p − p_prev) ·
      ROPE_CHAIN_DAMPING`, `p_prev = p`, `p += v + (0, GRAVITY) · dt²`; then
      `ROPE_CHAIN_ITERATIONS` passes enforce every segment's rest length (a
      hanging chain needs the gravity error to propagate all the way up to the
      anchor, which is why the count is high) by moving the two links toward or
      away from each other (a pinned link does not move; a free link takes the
      whole correction against a pinned one). A free rope is only this chain
      under gravity; when every link's speed is below `ROPE_SETTLE_SPEED` it
      snaps to hanging straight down and rests (it is not simulated again until
      a grab or release disturbs it)."
    result: passed
    reason:
      text: integrate implements v = (p-p_prev)*ROPE_CHAIN_DAMPING; p_prev = p; p += v
        + (0,GRAVITY)*dt^2 followed by 80 constraint passes with a pinned parent
        taking no correction and a free pair splitting it; step_free snaps to
        hanging and sets resting when is_settled, and returns early while
        resting (my probe confirmed an idle chain is bit-identical after 2 s).
      truncated: false
