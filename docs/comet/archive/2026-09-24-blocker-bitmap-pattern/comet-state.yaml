  checks_truncated: false
  known_limits:
    - text: "CORRECTION to my iteration 3 and 4 handoffs, which the iteration 4
        verifier caught: I claimed src/entities.rs has no test module at all.
        That was false - it has mod rope_tests at line 488 with six tests, two
        of which already exercised to_level_entity and from_level_entity for
        ropes. Only the polygon and pattern leg was uncovered, and this
        iteration covers it."
      truncated: false
    - text: "The placeholder branch of render_gallery_window is still not executed by
        any test, nor are the menu handlers, draw_polygon_pattern, the Mesh
        packing or TextureWrapMode::Repeat: all need an egui Context.
        gallery_strip, prune_unshowable, pattern_fill and apply_pattern, which
        make every decision those paths depend on, are tested directly."
      truncated: false
    - text: pointer_over_panels has no test covering gallery_rect, which the brief
        lists as a constraint. The rect is added to the same array as help_rect
        and size_dialog_rect, neither of which is tested either, so this is a
        pre-existing coverage shape rather than a new gap.
      truncated: false
    - text: "Unchanged and documented rather than fixed: exists() cannot distinguish a
        deleted file from one on an unmounted volume, so a launch taken while
        that volume is away still drops those entries and the next save writes
        the shorter list. Fixing it would mean recording why a path failed,
        which is beyond confirmed scope."
      truncated: false
    - text: Failure caching is still permanent for the session, so a remounted volume
        or repaired image shows the placeholder until restart.
      truncated: false
    - text: Per-frame re-triangulation with an O(n^3) worst case remains, along with a
        per-frame Vec<String> preload that mirrors the pre-existing bitmap loop
        above it.
      truncated: false
    - text: pattern_textures is still never evicted on New Level or on loading another
        level.
      truncated: false
    - text: the_gallery_round_trips_through_the_config_file depends on /tmp/bricks.png
        not existing on the machine; a stray file of that name would turn it
        red. Raised by the iteration 4 verifier and not addressed.
      truncated: false
    - text: Temp config files still accumulate in TMPDIR across runs, and
        a_temp_config_path keys on nanos plus ThreadId, which is practically but
        not provably collision-free.
      truncated: false
  known_limits_truncated: false
