acceptance:
  - id: A1
    source: brief.md
    text: "Scenario: With a blocker selected, choosing `Level → Blocker Pattern…`
      and picking `/tmp/bricks.png` stores `Some(\"/tmp/bricks.png\")` as that
      polygon's pattern and leaves every other polygon's pattern `None`."
    result: passed
    reason:
      text: apply_pattern writes only entities[selected_entity] (main.rs:342-360);
        choosing_a_pattern_puts_it_on_the_selected_blocker_alone
        (main.rs:3020-3027) uses a two-blocker fixture and asserts index 1 stays
        None.
      truncated: false
  - id: A2
    source: brief.md
    text: "Scenario: A polygon carrying a pattern is saved and loaded again, and the
      pattern path survives the round trip unchanged."
    result: passed
    reason:
      text: "The field is carried both ways (entities.rs:417 and 436-447) at the real
        save and load call sites (main.rs:776, 814), and this iteration closed
        the gap: entities::polygon_tests (entities.rs:501-523) round-trips a
        patterned blocker and asserts the pattern on the LevelEntity and again
        after converting back, so dropping it in either direction turns the test
        red. Mutation-checked."
      truncated: false
  - id: A3
    source: brief.md
    text: "Scenario: A level file whose polygon entries have no `pattern` key at all
      loads without error, and those polygons come back with `pattern: None`."
    result: passed
    reason:
      text: "#[serde(default)] at level_data.rs:59-62 with
        a_polygon_written_before_patterns_existed_loads_with_none (138-160)
        parsing JSON with no pattern key, plus an explicit-null case."
      truncated: false
  - id: A4
    source: brief.md
    text: "Scenario: A polygon with no pattern is drawn exactly as before — outline
      segments and vertex dots, and no filled mesh is emitted for it."
    result: passed
    reason:
      text: pattern_fill returns None at polygon.pattern.as_deref()? (main.rs:507-513)
        and draw_polygon_pattern early-returns (519-520); PolygonEntity::draw is
        untouched by the diff. Test at main.rs:3030-3038.
      truncated: false
  - id: A5
    source: brief.md
    text: "Scenario: A 64x64 pattern on a polygon whose bounding box is 256 wide and
      128 tall produces texture coordinates spanning 4.0 across and 2.0 down, so
      the image repeats four times horizontally and twice vertically at its
      native size."
    result: passed
    reason:
      text: uv_for is anchored to bounds.min (pattern.rs:45-53); the test asserts
        exactly 4.0 and 2.0 (pattern.rs:299-309) and a second proves the anchor
        is the shape rather than the world origin.
      truncated: false
  - id: A6
    source: brief.md
    text: "Scenario: A concave blocker shaped like an L is filled only inside its
      outline: the triangulation produces `n - 2` triangles for an `n`-vertex
      polygon and their combined area equals the polygon's own area."
    result: passed
    reason:
      text: "Verifier re-derived the fixture: the notched square has shoelace 12000 so
        area 6000, a naive fan totals 9000, and it hand-evaluated the ray-cast
        contains helper at the fan centroid (50,40), tracing all four crossings
        to confirm it returns false. Both checks discriminate independently. It
        noted the brief says 'shaped like an L' while the fixture is a notched
        square, a documented substitution made precisely because an L cannot
        discriminate; strictly no L fixture is tested."
      truncated: false
  - id: A7
    source: brief.md
    text: "Scenario: Setting a pattern pushes an undo entry, and undo restores the
      polygon to having no pattern."
    result: passed
    reason:
      text: save_state() precedes the mutation (main.rs:347); the test asserts the
        stack grew by exactly one and undo restores None (main.rs:3053-3063).
      truncated: false
  - id: A8
    source: brief.md
    text: "Scenario: `Clear Pattern` on a polygon that has one returns its pattern
      to `None`, and that is undoable too."
    result: passed
    reason:
      text: Clear Pattern calls apply_pattern(None) (main.rs:1687) through the same
        path; test at main.rs:3066-3080.
      truncated: false
  - id: A9
    source: brief.md
    text: "Scenario: Setting a pattern marks the level as having unsaved changes."
    result: passed
    reason:
      text: has_unsaved_changes compares hashes over the entities' Debug output
        (main.rs:586-588); one test asserts clean-then-dirty and another proves
        the gallery does not dirty the level.
      truncated: false
  - id: A10
    source: brief.md
    text: "Scenario: When no polygon is selected, or while play mode is running, the
      guard that drives the pattern menu items and the gallery thumbnails
      reports that they are unavailable."
    result: passed
    reason:
      text: can_set_pattern (main.rs:324-331) is the single guard used by the menu
        (1659) and the thumbnails (1346); the test covers all four states
        including a selected coin.
      truncated: false
  - id: A11
    source: brief.md
    text: "Scenario: A polygon whose pattern path does not exist or cannot be
      decoded is drawn as a plain outline, exactly like a polygon with no
      pattern, and the editor does not panic."
    result: passed
    reason:
      text: image::open(path).ok() swallows missing and undecodable alike
        (main.rs:483), the None is cached (503), and pattern_fill falls out at
        .as_ref()? (512). Test at main.rs:3041-3050.
      truncated: false
  - id: A12
    source: brief.md
    text: "Scenario: Using three different patterns in turn leaves the gallery
      holding all three, most recently used first."
    result: passed
    reason:
      text: Gallery::remember inserts at the front (pattern.rs:214-222); proven at
        unit level and end to end through apply_pattern (main.rs:3155-3165).
      truncated: false
  - id: A13
    source: brief.md
    text: "Scenario: Using a pattern that is already the third entry in the gallery
      moves it to the front and leaves the list twelve long at most, with no
      duplicate entry."
    result: passed
    reason:
      text: retain, insert(0) and truncate (pattern.rs:219-221); the test asserts
        entries()[2] is the target before reusing it, so the 'third entry'
        wording is genuinely exercised.
      truncated: false
  - id: A14
    source: brief.md
    text: "Scenario: Using a thirteenth distinct pattern evicts the oldest, so the
      list holds exactly twelve."
    result: passed
    reason:
      text: a_thirteenth_pattern_evicts_the_oldest (pattern.rs:416-430) asserts twelve
        remain, the oldest is gone and the next oldest is last.
      truncated: false
  - id: A15
    source: brief.md
    text: "Scenario: The gallery list is written to `rust_game_editor_config.json`
      and read back on the next launch, leaving `last_background` and
      `last_level` in that file untouched."
    result: passed
    reason:
      text: config_with_gallery mutates only recent_patterns (main.rs:434-448); the
        round-trip test seeds both other keys and asserts they survive and the
        value reads back. Verifier checked every EditorState::default() in the
        new test block individually, confirming each sets config_path_override,
        and ran the suite five times with the real config's md5 byte-identical
        throughout.
      truncated: false
  - id: A16
    source: brief.md
    text: "Scenario: A remembered pattern whose file no longer exists is dropped
      from the gallery rather than shown as a broken thumbnail."
    result: passed
    reason:
      text: "Both halves now hold with a single predicate. Skipped when drawn:
        gallery_strip filters on existence alone (main.rs:406-408, 1344).
        Dropped from the list: prune_unshowable on the same set (1345). Three
        tests cover the draw half, the list half including the shortened list
        being written, and the launch path."
      truncated: false
  - id: A17
    source: brief.md
    text: "Scenario: Clicking a gallery thumbnail with a blocker selected applies
      that pattern to it, through the same undoable path as the menu item."
    result: passed
    reason:
      text: The thumbnail handler calls the identical apply_pattern the menu reaches
        via choose_pattern (main.rs:1418-1421 vs 362-370); the test asserts
        apply, move-to-front, no duplicate and undo. The click itself remains
        by-reading, which the verifier agreed is the correct compromise without
        an egui Context in tests.
      truncated: false
builder_handoff:
  candidate_id: 8a851a3a-6105-493b-b0f7-fea7bdd3d648
