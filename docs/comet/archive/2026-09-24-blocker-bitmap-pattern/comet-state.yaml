          a_deleted_pattern_is_not_drawn_even_while_its_texture_is_still_cached.
          Dropping the pattern in to_level_entity fails the new conversion
          round-trip test. Earlier mutations still hold: fan triangulation,
          no-dedup, no save_state, no-op prune, decode-based prune, and the
