  iteration: 5
  summary:
    text: "Iteration 5 fixes the defect iteration 4 introduced and closes a coverage
      gap. gallery_strip now filters on existence alone, dropping the
      texture.is_some() clause, so it asks exactly the question prune_unshowable
      keeps by and the strip and the gallery can never disagree: a file that has
      gone is dropped from both in the same pass even when its texture is still
      cached, while one still on disk keeps its slot whether or not it decoded.
      The helper's doc comment now describes that and says why the predicates
      are deliberately identical. The test that pinned the wrong behaviour was
      replaced by
      a_deleted_pattern_is_not_drawn_even_while_its_texture_is_still_cached,
      which asserts the corrected rule directly. Existence is now decided once
      per frame into a HashSet shared by the strip and the prune, halving the
      stat calls and removing the chance of two passes seeing the filesystem
      differently. Separately, the A2 conversion gap is closed rather than
      merely disclosed: a new entities::polygon_tests module round-trips a
      patterned blocker through to_level_entity and from_level_entity and
      asserts a plain polygon gains no pattern. 241 tests pass, up from 238."
    truncated: false
  addressed_acceptance_ids:
