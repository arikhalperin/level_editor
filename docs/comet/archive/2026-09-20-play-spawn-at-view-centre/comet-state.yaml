acceptance:
  - id: A1
    source: brief.md
    text: "Scenario: With the view scrolled so the visible canvas covers world x
      800-1600 and y 400-1000, pressing F5 starts the character at world (1200,
      700), the centre of that visible area."
    result: passed
    reason:
      text: start_play (main.rs:787-795) takes view_centre(). Test
        play_starts_the_character_at_the_centre_of_the_visible_canvas
        (main.rs:2432-2445) uses canvas (0,40)-(800,640) with offset (800,360),
        giving visible world x 800..1600 and y 400..1000, and asserts spawn
        (1200,700) and play_spawn == Some((1200,700)). Offsets are integral so
        pixel_offset()'s round() (scroll.rs:110-112) introduces no drift.
      truncated: false
  - id: A2
    source: brief.md
    text: "Scenario: With the view at the level origin so the visible canvas covers
      world x 0-800 and y 0-600, pressing F5 starts the character at world (400,
      300)."
    result: passed
    reason:
      text: play_starts_at_the_centre_with_the_view_at_the_level_origin
        (main.rs:2446-2460) asserts (400,300) for canvas (0,0)-(800,600) at zero
        offset. Verifier noted that fixture's y=0 origin cannot occur in the
        real app, but the realistic y-axis case is carried by A1's fixture and
        by the_centre_is_the_canvas_centre_not_the_window_centre
        (main.rs:2461-2474), which asserts (640,400) against the window-centre
        answer (640,380).
      truncated: false
  - id: A3
    source: brief.md
    text: "Scenario: The user clicks the canvas at world (50, 50), scrolls far away
      so that point is off screen, then presses F5. The character starts at the
      centre of the new visible area, not at (50, 50)."
    result: passed
    reason:
      text: a_click_made_before_play_no_longer_decides_where_the_run_begins
        (main.rs:2475-2487) sets last_click_pos=(50,50) and still asserts
        (1200,700) plus an explicit assert_ne! against (50,50). start_play no
        longer reads last_click_pos at all; the diff removes it from the spawn
        chain.
      truncated: false
  - id: A4
    source: brief.md
    text: "Scenario: After play has started at the view centre, pressing R restarts
      the run with the character back at that same view-centre point."
    result: passed
    reason:
      text: "restarting_the_run_returns_the_character_to_the_view_centre
        (main.rs:2488-2503) moves the player to (4000,2000), calls restart(),
        and asserts return to (1200,700). Chain independently traced:
        PlaySession::restart -> Simulation::respawn -> respawn_at(self.spawn)
        (combat.rs:770-774, sim.rs:442-452), spawn set from PlaySession::new at
        main.rs:804. The R handler (main.rs:1397-1401) calls exactly
        play.restart()."
      truncated: false
  - id: A5
    source: brief.md
    text: "Scenario: While playing, a left click on the canvas at a visible point
      still moves the spawn to that point and respawns the character there."
    result: passed
    reason:
      text: "Extraction verified behaviour-preserving: the removed inline block and
        move_play_spawn (main.rs:809-822) are line-for-line identical, and the
        call site (main.rs:1845) passes the same two values under the unchanged
        guard (main.rs:1843-1845). Effect is covered by
        a_click_while_playing_still_moves_the_spawn_and_respawns_there
        (main.rs:2504-2519). Caveat recorded: no test drives a real click
        through the dispatch path; that half rests on the byte-identical diff."
      truncated: false
  - id: A6
    source: brief.md
    text: "Scenario: Starting play from the Play menu places the character at the
      same point that F5 would."
    result: passed
    reason:
      text: Play menu (main.rs:1305-1312) and F5 (main.rs:1390-1392) both call the
        same toggle_play (main.rs:837-843). Verifier independently confirmed
        both sites precede the scroll_offset update (main.rs:1426-1428) and the
        canvas_rect assignment (main.rs:1549), so on any frame both read
        identical inputs and must yield the identical spawn. The test proves
        toggle_play determinism; the equality claim rests on that code read.
      truncated: false
  - id: A7
    source: brief.md
    text: "Scenario: Stopping play restores the editor's scroll position to exactly
      where it was when play began."
    result: passed
    reason:
      text: stop_play is unchanged by this diff and restores via camera::restore then
        recomputes scroll_offset (main.rs:824-835); capture/restore are exact
        copies with velocity zeroed (camera.rs:110-119).
        stopping_play_restores_the_view_it_began_with (main.rs:2536-2549)
        wanders the camera to (9000,1200) and asserts the exact pre-play offset
        returns.
      truncated: false
  - id: A8
    source: brief.md
    text: "Scenario: When no canvas rectangle has been recorded yet, starting play
      falls back to the remembered `play_spawn`, and to `(100, 100)` when there
      is none, so the spawn is always defined."
    result: passed
    reason:
      text: view_centre() returns None when canvas_rect is None (main.rs:783-785) and
        start_play chains .or(play_spawn).unwrap_or((100,100))
        (main.rs:792-795).
        without_a_laid_out_canvas_play_falls_back_to_the_last_spawn
        (main.rs:2550-2569) covers both branches. canvas_rect defaults to None
        (main.rs:186) and new_level correctly does not reset it.
      truncated: false
