  summary:
    text: "start_play now spawns the character at the centre of the visible canvas
      instead of at last_click_pos. Changes in src/main.rs: (1) new field
      canvas_rect: Option<egui::Rect>, recorded each frame from the same
      ctx.available_rect() the minimap and play camera already use, so it
      excludes the menu bar; (2) new pure helper view_centre() returning
      canvas_rect.center() + scroll_offset; (3) start_play's spawn chain is now
      view_centre() -> play_spawn -> (100,100), with last_click_pos removed from
      it; (4) the click-during-play branch was extracted verbatim into
      move_play_spawn(spawn, panel) so that behaviour is unit-testable without
      running update(); it is unchanged. play_spawn is still written at play
      start, so restart and death respawn return to the view centre. Doc comment
      on play_spawn corrected, and two help entries (F5, Play menu) now say
      where the character starts. Nine new tests in editor_state_tests cover all
      eight acceptance items plus the menu-bar constraint. Mutation-checked:
      reverting start_play to the old last_click_pos chain fails 6 of the 9 new
      tests; the 3 that still pass cover behaviour this change deliberately
      leaves alone (click-during-play respawn, view restore on stop, and the
      shared fallback chain)."
    truncated: false
  addressed_acceptance_ids:
    - A1
    - A2
    - A3
    - A4
    - A5
    - A6
    - A7
    - A8
