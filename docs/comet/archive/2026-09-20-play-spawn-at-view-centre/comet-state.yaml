  known_limits:
    - text: The per-frame recording of canvas_rect lives inside eframe::App::update,
        which the existing test suite never invokes (no test in this repo
        constructs an eframe::Frame). That one assignment is therefore covered
        by reasoning and by the GUI itself, not by an automated test. The value
        it records is the same ctx.available_rect() already passed to
        minimap::layout and the play camera on the same line, so a wrong rect
        there would also break existing minimap and camera behaviour.
      truncated: false
    - text: A1 and A2 assert exact world coordinates derived from a synthetic canvas
        rectangle; they verify the arithmetic, not the real window's layout.
      truncated: false
    - text: Acceptance A6 is covered by testing toggle_play, which is the single
        function both the F5 key handler and the Play menu item call. The two
        call sites themselves are one-line calls inside update() and are not
        separately exercised.
      truncated: false
  known_limits_truncated: false
