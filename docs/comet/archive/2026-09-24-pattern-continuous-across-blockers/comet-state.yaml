acceptance:
  - id: A1
    source: brief.md
    text: "Scenario: Two blockers share the edge x = 256, one spanning world x
      0..256 and the other x 256..512, both with a 64x64 pattern. The texture
      coordinate at the shared edge is 4.0 computed from either blocker, so the
      pattern runs across the join unbroken."
    result: passed
    reason:
      text: "two_blockers_sharing_an_edge_continue_the_pattern_across_it
        (pattern.rs:349-373): left spans 0..256, right 256..512, texture 64x64.
        Asserts left_uv[1].x == 4.0, right_uv[0] == left_uv[1], right_uv[1].x ==
        8.0. The verifier confirmed the two sides come from two independent
        fill_mesh calls via the uvs helper, so the agreement assertion is
        genuinely cross-shape and not a self-comparison."
      truncated: false
  - id: A2
    source: brief.md
    text: "Scenario: A blocker whose bounding box starts at world (1000, 500), with
      a 64x64 pattern, has texture coordinate (15.625, 7.8125) at that corner
      rather than (0, 0), because the tiling is measured from the world origin."
    result: passed
    reason:
      text: the_tiling_is_measured_from_the_world_not_the_shapes_own_corner
        (pattern.rs:336-348) asserts uv[0] == (1000/64, 500/64) = (15.625,
        7.8125), both exactly representable in f32 so the equality is exact
        rather than lucky, plus an explicit assert_ne against (0,0), which is
        what shape anchoring would have given.
      truncated: false
  - id: A3
    source: brief.md
    text: "Scenario: A blocker whose bounding box already starts at the world origin
      is drawn exactly as it was before this change, with its corner at texture
      coordinate (0, 0) and a 256x128 shape spanning 4.0 by 2.0."
    result: passed
    reason:
      text: pattern.rs:325-334 asserts corner (0,0) and uv[2] == (4.0, 2.0) for the
        256x128 square, now routed through fill_mesh rather than raw uv_for,
        which the verifier judged strictly stronger than the HEAD version. It
        cannot discriminate this change, since a shape cornered on the origin
        answers the same either way, and that is stated in the test's own
        comment and in the disclosed limits rather than oversold.
      truncated: false
  - id: A4
    source: brief.md
    text: "Scenario: Moving a blocker changes its texture coordinates, so the
      pattern stays fixed to the world and the shape slides over it. This is the
      accepted cost of neighbours lining up, and is asserted so it cannot change
      unnoticed."
    result: passed
    reason:
      text: moving_a_blocker_slides_it_over_a_pattern_fixed_to_the_world
        (pattern.rs:374-387) asserts before[0] != after[0] and the exact value
        after[0] == (0.5, 0.0) for a 32px move over a 64px tile. The exact-value
        assertion is what makes the accepted trade-off impossible to change
        unnoticed.
      truncated: false
  - id: A5
    source: brief.md
    text: "Scenario: The fill still follows the outline: a concave blocker yields `n
      - 2` triangles whose combined area equals the polygon's own area,
      unchanged by the new anchor."
    result: passed
    reason:
      text: a_concave_shape_is_filled_only_inside_its_outline (pattern.rs:389-414)
        still yields n-2 triangles whose area is within 0.01 of the polygon's
        own 6000, with every centroid inside by ray casting. triangulate has
        zero delta in this change, so the anchor cannot affect it.
      truncated: false
  - id: A6
    source: brief.md
    text: "Scenario: A polygon with no pattern still emits no fill, and a pattern
      whose image will not decode still falls back to a bare outline."
    result: passed
    reason:
      text: an_unpatterned_polygon_is_drawn_with_no_fill_at_all (main.rs:3030-3038)
        and a_pattern_whose_image_will_not_load_falls_back_to_the_bare_outline
        (main.rs:3040-3051). pattern_fill still short-circuits on the missing
        pattern and on a cached None texture before reaching fill_mesh;
        unchanged by this diff.
      truncated: false
builder_handoff:
  candidate_id: 3cf8d8c0-cf52-4d75-803f-415cd0024d6c
  identity_provider: skill-coordinated
  builder_execution_ref: skill-coordinated:builder:17d46390-ffe8-447b-b87d-7e358a31299b
  iteration: 2
  summary:
    text: "Both minor defects fixed. uv_for loses its vestigial origin parameter and
      is now uv_for(point, texture_size) = point / texture_size, with the doc
      stating why it depends on nothing but the point and the texture: that is
      exactly what makes two polygons meeting at a vertex agree. Its zero-size
      guard, which fill_mesh can no longer reach, is now covered directly by
      a_texture_with_no_size_has_no_meaningful_coordinate, including the
      negative-size case. The stale assertion message in
      fill_mesh_pairs_every_vertex_with_its_texture_coordinate, which still
      claimed the texture was anchored to the shape, now says what that
      assertion actually guards: the texture coordinate ignores the scroll, so
      the pattern does not swim as the view moves. One further test added,
      a_world_point_maps_to_the_same_coordinate_whichever_polygon_asks, stating
      the property the change rests on directly rather than only through two
      shapes that happen to meet. 245 tests pass, up from 243."
    truncated: false
  addressed_acceptance_ids:
    - A1
    - A2
    - A3
    - A4
    - A5
    - A6
