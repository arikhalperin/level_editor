          record: the previous verifier pointed out this figure counts cargo's
          two trailing summary lines, so it is 10 warnings proper."
        truncated: false
    - name:
        text: cargo test
        truncated: false
      result: passed
      note:
        text: 245 unit tests plus 1 integration, 0 failed.
        truncated: false
    - name:
        text: mutation check
        truncated: false
      result: passed
      note:
        text: "From the previous candidate and still applicable: restoring bounding-box
          anchoring fails the world-anchoring, shared-edge and moving tests. The
          regression-guard test correctly still passes, since its shape is
          cornered on the world origin."
        truncated: false
  checks_truncated: false
  known_limits:
    - text: "The trade-off is unchanged and confirmed in Shape: a pattern is fixed to
        the world, so dragging a blocker slides the shape over it. Pinned by an
        exact-value assertion."
      truncated: false
    - text: Still no executable coverage of draw_polygon_pattern, the Mesh packing or
        TextureWrapMode::Repeat, so nothing automated proves two adjacent
        blockers visually line up on screen; the texture coordinates they would
        be drawn with are asserted directly, which is the strongest headless
        evidence available.
      truncated: false
    - text: A3 remains a pure regression guard that cannot discriminate this change,
        since a shape cornered on the world origin gets the same answer under
        either anchoring. That is stated in the test's own comment, and A1, A2
        and A4 carry the discriminating power.
      truncated: false
    - text: "This does nothing about an image that does not tile cleanly against
        itself: any internal joins in the image remain, now running continuously
        across blockers rather than restarting at each one. That is the separate
        seamless-texture problem."
      truncated: false
    - text: "Everything carried over from the previous change is unchanged: per-frame
        re-triangulation with an O(n^3) worst case, pattern_textures never
        evicted, exists() unable to distinguish a deleted file from an unmounted
        volume, permanent per-session failure caching, the untested egui paths,
        and the cosmetic items recorded there."
      truncated: false
  known_limits_truncated: false
