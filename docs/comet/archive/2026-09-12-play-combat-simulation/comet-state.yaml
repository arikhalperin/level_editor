acceptance:
  - id: A1
    source: brief.md
    text: "A1 — Entities spawn: entering play in a level containing `orc_tool`,
      `coin_tool` and `death_trap_tool` bitmaps creates an orc, a coin and a
      death pit at those positions; other bitmap names create nothing."
    result: passed
    reason:
      text: combat.rs:271-291 from_bitmaps matches only ORC/COIN/DEATH_PIT_BITMAP with
        `_ => {}`; main.rs:603-613 bitmap_spawns feeds it, main.rs:630 builds on
        entering play. Test bitmap_names_map_to_the_same_things_the_game_spawns
        covers all three plus wall_tool and anything_else.
      truncated: false
  - id: A2
    source: brief.md
    text: "A2 — Attack input: `J` or `X` swings the katana; a press within
      `ATTACK_INPUT_BUFFER_SEC` 0.12 of becoming able to attack is honoured; a
      second swing inside `SLASH_COOLDOWN` 0.28 is refused."
    result: passed
    reason:
      text: combat.rs:359-364 sets the 0.12 buffer on the press edge; :373-397 refuses
        while cooldown>0 and re-arms 0.28. Tests at combat.rs:908 and :936.
        main.rs:668 binds J and X.
      truncated: false
  - id: A3
    source: brief.md
    text: "A3 — Slash direction: holding up slashes up; holding down while airborne
      slashes down; otherwise forward. Left-click still moves the spawn point
      and never attacks."
    result: passed
    reason:
      text: "combat.rs:380-386 Up / airborne-Down / else Forward (test includes
        grounded-down staying Forward). main.rs:1632-1641: a play-mode click
        only sets play_spawn and respawns; attack is read only from J/X
        (main.rs:668), never the pointer."
      truncated: false
  - id: A4
    source: brief.md
    text: "A4 — Slash timing: the forward blade is live 0.083–0.150 s into a 0.25 s
      swing, up/down 0.0625–0.1875 s; outside that window nothing is hit."
    result: passed
    reason:
      text: "combat.rs:412-416 returns unless ActiveSlash::is_live() (:85). Windows
        from game_config.rs:90-95, re-derived from the game's clip table
        (animation.rs:286-320: hit_frames (5,8) 15 cols@60fps; (2,5) 8
        cols@32fps) and AnimationClip::hit_window ending at time_of_frame(b+1)
        (animation.rs:379-383)."
      truncated: false
  - id: A5
    source: brief.md
    text: "A5 — Slash reach: an orc centred 54 px ahead within the 62×50
      half-extents is hit; one beyond the box is not. The hitbox keeps the
      facing the swing began with."
    result: passed
    reason:
      text: "Hitbox combat.rs:47-66. an_orc_just_outside_the_hitbox_edge_is_not_hit
        (combat.rs:1402) tests both sides of REACH+HALF_W+ORC_RADIUS=148 (miss
        at 152, hit at 142). Facing is captured at swing start (:395) and
        a_swing_keeps_hitting_where_it_started_even_if_the_player_turns (:1040)
        is falsifiable: at the window open the player has drifted ~12 px left,
        so a live-facing box would span roughly x[-128,-4] and could not reach
        the orc's [22,86]; the test also asserts the player really turned."
      truncated: false
  - id: A6
    source: brief.md
    text: "A6 — Recoil and pogo: a landed forward slash pushes the player away at
      400 px/s for 0.1 s; a landed airborne down slash sets upward velocity for
      a 160 px rise and restores the air dash. One orc takes at most one hit per
      swing."
    result: passed
    reason:
      text: Recoil combat.rs:446-450 with the test at :1179 asserting vx == -400 ±1 at
        the instant of the hit and that it holds against opposite input; pogo
        :451-454 + sim.rs:262-270 with the test at :1207 asserting launch ==
        sqrt(2*GRAVITY*160) ±1 and a usable air dash with no landing; per-swing
        dedupe :426-429 with test :1168.
      truncated: false
  - id: A7
    source: brief.md
    text: "A7 — Orc AI: an orc idles until the player is within 400 px, winds up 1.0
      s, charges to a 250 px/s cap, and switches to Attacking within 105 px,
      returning to Idle beyond 160 px."
    result: passed
    reason:
      text: combat.rs:534-593 implements the four states with 105/400/160, 1.0 s
        wind-up, launch 200, accel 1000, clamp 250 — matching
        behavior.rs:106-135, :182-198, :341, :483. Tests :1160, :1167, :1189.
      truncated: false
  - id: A8
    source: brief.md
    text: "A8 — Orc stops safely: a charging orc halts 50 px before a wall and at a
      ledge rather than walking off, and falls under gravity like the player."
    result: passed
    reason:
      text: "Re-verified independently; both tests are now falsifiable. Ledge
        (combat.rs:1304): a second platform at 300..900 keeps the player
        grounded 350 px away (asserted), `charged` proves the orc entered
        Charging, travel >20 px is asserted, and in that world blocked_ahead can
        never fire (its probe at y=430 lies above every polygon), so only
        ground_ahead can stop the charge — the assertion pos.x +
        ORC_LEDGE_PROBE_FORWARD_PX <= 208 is exactly the never-crossed-the-edge
        property, plus grounded and y<600. Wall (combat.rs:1341): the floor is
        continuous so ground_ahead is always true and only blocked_ahead can
        stop it; gap >= 50-6 is failed by the 32 px gap a bare capsule collision
        at x=168 leaves. Gravity/rest covered by combat.rs:1374."
      truncated: false
  - id: A9
    source: brief.md
    text: "A9 — Orc power: four sword hits defeat an orc; each non-lethal hit
      freezes it 0.35 s and knocks it back 260/120 for 0.3 s; defeat adds 100 to
      the score."
    result: passed
    reason:
      text: combat.rs:431-444. four_sword_hits_defeat_an_orc_and_score_the_defeat
        (:1083) asserts exactly 4 swings and +100;
        a_non_lethal_hit_freezes_and_knocks_the_orc_back (:1103) asserts vx ==
        260 ±1 and vy == -120 + GRAVITY*DT ±1 — the one-step allowance is
        correct because resolve_slash_hits runs before step_orcs — and further
        asserts the freeze does not cancel the knockback at 0.15 s.
      truncated: false
  - id: A10
    source: brief.md
    text: "A10 — Club window: the orc's club damages only between 0.25 s and 0.5 s
