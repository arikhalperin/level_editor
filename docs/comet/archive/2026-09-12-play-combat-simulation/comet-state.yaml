  - id: A40
    source: specs/play-combat/spec.md
    text: While a swing is live on the ground, horizontal speed is multiplied by
      `SLASH_GROUND_SPEED_MULT` 0.35. A landed forward slash recoils the player
      at `SLASH_RECOIL_SPEED` 400 away from the target, held `SLASH_RECOIL_SECS`
      0.1. A landed **airborne** down slash pogos the player to `POGO_HEIGHT`
      160 and restores the air dash. Each orc is hit at most once per swing.
    result: passed
    reason:
      text: "combat.rs:403-408 clamps |vel.x| to 600*0.35=210 while a swing is live
        and grounded. The cap fix is faithful: the game multiplies the run basis
        target speed (controller.rs:535-539), so steady-state ground speed is
        210 and slower speeds are unaffected; a per-step multiply would
        compound. The !is_input_locked() exemption is also correct — the game
        overrides speed_mult during recoil (:545-549) and a wall-jump lock
        (:541-544), exactly the cases that set input_lock_left. The cap itself
        has no test."
      truncated: false
