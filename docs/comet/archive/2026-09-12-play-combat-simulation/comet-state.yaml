  summary:
    text: "Iteration 3 - repairs A8/A68 and clears the remaining test-strength and
      fidelity risks. A8/A68 were a genuine test defect, not a behaviour defect,
      and the Verifier's diagnosis was exactly right on both halves. The ledge
      test spawned the player at x=350 over a floor that ended at x=200, so the
      player fell out of the orc's 400 px detection radius, the orc never left
      Idle, and `pos.x < 232` could not fail. It now puts a second platform at
      300..900 so the player stands within detection range, records whether the
      orc ever actually entered Charging and asserts it did, asserts the orc
      travelled at least 20 px, and then asserts the real property - that the
      orc's ledge probe never crossed the edge (pos.x +
      ORC_LEDGE_PROBE_FORWARD_PX <= 200) - plus that it is still grounded and
      never fell into the gap. The wall test asserted only pos.x < 200, which a
      bare capsule resting at 200 - ORC_CAPSULE_RADIUS = 168 also satisfies; it
      now likewise proves the orc charged and then asserts the standoff itself,
      gap >= ORC_WALL_STOP_DISTANCE_PX - 6, which a plain collision (gap 32)
      would fail. REMAINING RISKS CLEARED: the wall jump did not clear the
      `bounce` flag, so a wall jump taken after a pogo without an intervening
      landing would have skipped the release-shorten gravity - sim.rs now clears
      it at wall-jump takeoff alongside the ground jump. The facing test was
      renamed and split: hitbox_geometry_mirrors_with_facing keeps the pure
      geometry check, and a new
      a_swing_keeps_hitting_where_it_started_even_if_the_player_turns starts a
      swing facing right, holds left for the rest of it, asserts the player
      really did turn, and asserts the blade still connected on the right - so
      the mid-swing freeze is now tested rather than inspected. The orc sword
      knockback now asserts the exact 260 horizontal and the exact -120 pop
      (less the one step of gravity that the hit-then-integrate ordering
      necessarily applies, with the reason written into the assertion) and that
      the freeze does not cancel it half a knockback later. A new
      the_club_misses_outside_its_separation_box holds an orc attacking with a
      live club just beyond ORC_CLUB_HIT_MAX_SEPARATION_X_PX and asserts no
      damage, which was the missing negative case. Full acceptance list
      rechecked; A1-A80 all addressed."
