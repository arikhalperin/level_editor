acceptance:
  - id: A1
    source: brief.md
    text: A1 — With the Rope tool active, a first click at world (400, 100) and a
      second click at (430, 400) creates one rope anchored at (400, 100) with
      length 300. A second click above the anchor or less than 60 px below it
      does nothing; Escape (or switching tools) cancels the rope in progress; a
      preview line follows the cursor between the two clicks.
    result: passed
    reason:
      text: RopeEntity::place (entities.rs) sets the anchor on the first click,
        finishes with length=click.y-anchor.y (x ignored) only when >=
        ROPE_MIN_LENGTH, else Ignore; unit test
        placement_takes_the_anchor_then_a_lower_click_and_ignores_the_rest
        covers (400,100)->(430,400)=300, above and too-close; main.rs clears
        drawing_rope on tool switch and EscapeAction::CancelRope, and paints a
        ghost line from anchor to the cursor.
      truncated: false
  - id: A2
    source: brief.md
    text: A2 — A rope is drawn as a vertical line from its anchor with a small
      anchor knob. With the Select tool, clicking within 8 px of the line
      selects it and dragging moves the whole rope; the Delete tool removes it;
      undo and redo apply to placing, moving and deleting a rope.
    result: passed
    reason:
      text: RopeEntity::paint draws a 6 px line plus an anchor disc; contains_point
        uses distance_to_segment <= ROPE_HIT_DISTANCE 8 (tested at 7 px in / 10
        px out); translate moves the anchor and keeps length; Select/Erase arms
        in main.rs use the generic Entity::contains_point/translate/remove paths
        and save_state, so undo/redo cover place, move and delete.
      truncated: false
  - id: A3
    source: brief.md
    text: A3 — Saving writes the rope as
      `{"type":"bitmap","position":[400,100],"bitmap_name":"rope_tool","size":[6,300]}`;
      loading that file restores a rope with the same anchor and length; a level
      file with no ropes loads exactly as before.
    result: passed
    reason:
      text: to_level_entity emits LevelEntity::Bitmap{position:[anchor],
        bitmap_name:"rope_tool", size:[6,length]} and from_level_entity branches
        on ROPE_BITMAP; test
        a_rope_saves_as_a_rope_tool_bitmap_entry_and_loads_back round-trips
        through serde JSON; other_bitmaps_still_load_as_bitmaps and the
        untouched level_data.rs cover files without ropes and the schema.
      truncated: false
  - id: A4
    source: brief.md
    text: A4 — In play, holding up or down while the character's centre is within 30
      px of the rope's line (and at least 40 px below the anchor) attaches the
      character to the rope at that height; the overlay state reads `rope`; the
      character hangs at the hold point with zero velocity if it arrived slowly.
    result: passed
    reason:
      text: try_grab_rope requires axis_y != 0, no regrab lock, not dashing, distance
        <= ROPE_GRAB_HALF_WIDTH to the segment from ROPE_MIN_HOLD below the
        anchor to the end; state becomes State::Rope labelled "rope"; test
        holding_up_beside_a_rope_grabs_it_at_that_height asserts the hold
        height, label and zero-velocity snap (vel = t*(hold*omega) with omega
        from v=0).
      truncated: false
  - id: A5
    source: brief.md
    text: A5 — Released from rest at 30° with no input, the character swings through
      the bottom and back to within 10% of a period of `2π·sqrt(L / GRAVITY)`,
      and the damped swing settles to hanging straight down.
    result: passed
    reason:
      text: step_rope integrates omega' = -(G/L) sin(theta) - damping*omega; test
        a_rope_swings_with_the_pendulum_period_and_settles measures the
        zero-crossing period from 30 deg within 10% of 2*pi*sqrt(L/G) and
        asserts |theta| < 0.01 after 30 s.
      truncated: false
  - id: A6
    source: brief.md
    text: A6 — From a hanging rest, holding right builds a swing; the rope's angle
      never exceeds 75° from vertical however long the key is held.
    result: passed
    reason:
      text: Pump a_t = axis_x*ROPE_PUMP_ACCEL feeds omega' and the angle is clamped to
        +-ROPE_MAX_ANGLE_DEG with omega zeroed outward; test
        pumping_builds_a_swing_capped_at_the_max_angle holds right for 20 s and
        asserts angle <= cap and reaches it.
      truncated: false
  - id: A7
    source: brief.md
    text: A7 — Up / down move the hold point along the rope at `CLIMB_SPEED` 140
      px/s, no closer than 40 px to the anchor and no further than the rope's
      length.
    result: passed
    reason:
      text: hold += axis_y*CLIMB_SPEED*dt (axis_y = down - up, so up shortens) clamped
        to [ROPE_MIN_HOLD, length]; test
        up_and_down_move_the_hold_along_the_rope_within_bounds checks 140 px/s
        and both bounds.
      truncated: false
  - id: A8
    source: brief.md
    text: A8 — Pressing jump while on the rope releases the character with the
      swing's tangential velocity plus an upward speed equal to a
      `WALL_JUMP_HEIGHT` 190 px jump; the rope cannot be re-grabbed for 0.25 s;
      landing on ground afterwards behaves as any landing.
    result: passed
    reason:
      text: On jump_buffer the release sets vel = t*(L*omega) + (0,
        -jump_speed(ROPE_RELEASE_HOP_HEIGHT)), air_dashes_used = 0,
        regrab_lock_left = 0.25, state Airborne; test
        jump_releases_with_the_swing_velocity_plus_a_hop_and_locks_regrab
        verifies velocity, the hop, the rope swinging on and no grab during the
        lock; landing then goes through the normal integrate path.
      truncated: false
  - id: A9
    source: brief.md
    text: A9 — Jumping into a rope at run speed starts a swing whose initial angular
      velocity equals the character's velocity projected on the rope's tangent
      divided by the hold length.
    result: passed
    reason:
      text: On grab omega = vel.dot(tangent)/hold; test
        running_into_a_rope_carries_momentum_into_the_swing asserts omega ~
        PLAYER_RUN_SPEED/L.
      truncated: false
  - id: A10
    source: brief.md
    text: A10 — Hitting a solid polygon while swinging pushes the character out as
      usual and stops the swing; being hurt or dying drops the rope; dash and
      wall jump are unavailable while on a rope.
    result: passed
    reason:
      text: step_rope runs deepest_overlap push-out, then re-aims theta = atan2(dx,dy)
        and zeroes omega (test a_wall_in_the_swing_path_stops_the_swing);
        lock_control/apply_knockback call drop_rope and death restarts via
        Simulation::new; step returns before try_start_dash/step_jump while
        rope_hold is set (test
        being_hurt_drops_the_rope_and_dash_cannot_start_on_it).
      truncated: false
  - id: A11
    source: brief.md
    text: A11 — After release the rope keeps swinging with damping until it hangs
      still; a grab takes the rope's current angle; while editing (not playing)
      every rope hangs straight down.
    result: passed
    reason:
      text: step_free_ropes integrates every unheld rope with damping and snaps to
        rest below 0.5 deg / 0.02 rad/s; try_grab_rope keeps swing.angle;
        main.rs draws Entity::Rope via entity.draw (straight down) when
        self.play is None.
      truncated: false
  - id: A12
    source: brief.md
    text: A12 — Play never modifies a rope entity and never affects
      `has_unsaved_changes()`.
    result: passed
    reason:
      text: Rope swings live in Simulation::rope_swings, not in entities; the
        Rope-tool arm and save_state sit in the non-play branch of the click
        handler; respawn/restart rebuild the Simulation so every rope is reset
        (test respawn_resets_every_rope_to_hanging_still); stop_play drops the
        session.
      truncated: false
  - id: A13
    source: brief.md
    text: A13 — The help window's Tools section lists `Rope` with the kind hint
      `click the anchor, then click the bottom end`; its Mouse section has a
      Rope-tool row; the up/down, left/right, jump and Escape rows mention
      ropes; the README, `LEVEL_FORMAT.md` and `BEVY_INTEGRATION.md` describe
      the rope entry.
    result: passed
    reason:
      text: help.rs adds kind_hint("rope") = "click the anchor, then click the bottom
        end", the "Left click — Rope tool" mouse row, and the rope wording in
        the Escape, A/D, W/S and Space rows; README, LEVEL_FORMAT.md and
        BEVY_INTEGRATION.md all describe the rope entry (grep confirmed).
      truncated: false
  - id: A14
    source: brief.md
    text: A14 — `game_config.rs` carries the rope constants (`ROPE_BITMAP`,
      `ROPE_THICKNESS`, `ROPE_MIN_LENGTH`, `ROPE_MIN_HOLD`,
      `ROPE_GRAB_HALF_WIDTH`, `ROPE_PUMP_ACCEL`, `ROPE_DAMPING`,
      `ROPE_MAX_ANGLE_DEG`, `ROPE_RELEASE_HOP_HEIGHT`, `ROPE_REGRAB_LOCK`) with
      the equations in the `rope-swing` spec as the model for the game.
    result: passed
    reason:
      text: game_config.rs declares ROPE_BITMAP "rope_tool", ROPE_THICKNESS 6,
        ROPE_MIN_LENGTH 60, ROPE_MIN_HOLD 40, ROPE_GRAB_HALF_WIDTH 30,
        ROPE_PUMP_ACCEL 900, ROPE_DAMPING 0.35, ROPE_MAX_ANGLE_DEG 75,
        ROPE_RELEASE_HOP_HEIGHT = WALL_JUMP_HEIGHT, ROPE_REGRAB_LOCK 0.25 with a
        comment naming it the game's model.
      truncated: false
